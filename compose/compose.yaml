services:
  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped
    command:
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.web.http.redirections.entryPoint.to=:8443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.file.directory=/etc/traefik/dynamic"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/opt/ac-platform/traefik/dynamic:/etc/traefik/dynamic:ro"
      - "/opt/ac-platform/certs:/certs:ro"
    networks:
      - frontend-net
      - socket-net
  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.4.2
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - socket-net
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: postgres
    secrets:
      - postgres_password
    networks:
      - data-net
    volumes:
      - postgres-data:/var/lib/postgresql/data
networks:
  frontend-net:
  socket-net:
    internal: true
  app-net:
    internal: true
  data-net:
    internal: true
volumes:
  postgres-data:
secrets:
  postgres_password:
    file: /opt/ac-platform/secrets/postgres_password
