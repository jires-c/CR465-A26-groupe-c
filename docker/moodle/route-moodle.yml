# CR465 - Routage HTTPS de Moodle avec Traefik
# Traefik reçoit les requêtes HTTPS sur le port 4443.

http:
  routers:
    moodle:
      rule: "Host(`moodle.localhost`)"
      entryPoints:
        - websecure
      service: moodle-service
      tls: {}

# Transmission des requêtes vers le conteneur Moodle
# Moodle écoute sur le port 8080 du réseau Docker.
  services:
    moodle-service:
      loadBalancer:
        servers:
          - url: "http://moodle:8080"
