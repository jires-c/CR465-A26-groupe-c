# Service Moodle : plateforme d'apprentissage du projet CR465

services:

  moodle:
    image: erseco/alpine-moodle:v5.3.0
    container_name: moodle

    restart: unless-stopped

    environment:
# Configuration Moodle
      SITE_URL: "https://moodle.localhost:4443"
      MOODLE_USERNAME: ${MOODLE_USERNAME}
      MOODLE_PASSWORD: ${MOODLE_PASSWORD}
      MOODLE_EMAIL: ${MOODLE_EMAIL}

# Configuration PostgreSQL : connexion à la base Moodle de GroupeC
      DB_TYPE: pgsql
      DB_HOST: ${MOODLE_DB_HOST}
      DB_PORT: "5432"
      DB_NAME: ${MOODLE_DB_NAME}
      DB_USER: ${MOODLE_DB_USER}
      DB_PASS: ${MOODLE_DB_PASSWORD}

# Reverse proxy : configuration HTTPS derrière Traefik
      REVERSEPROXY: "false"
      SSLPROXY: "true"

# Stockage persistant : conservation des données Moodle

    volumes:
      - moodledata:/var/www/moodledata

    networks:
      - frontend
      - database


volumes:
  moodledata:


# Réseaux Docker :
# - GroupeC-applicatif : communication avec Traefik
# - GroupeC-donnees : communication avec PostgreSQL

networks:
  frontend:
    external: true
    name: GroupeC-applicatif

  database:
    external: true
    name: GroupeC-donnees
