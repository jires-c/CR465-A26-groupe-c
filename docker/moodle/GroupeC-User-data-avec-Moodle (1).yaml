  # ------------------------------------------------------------------------
  # SECTION BONUS +2 POINTS - OPENAPPSEC (WAF local) : NON DEPLOYE
  # ------------------------------------------------------------------------
  - path: /opt/GroupeC/OpenAppsec/docker-compose.yml
    owner: root:root
    permissions: "0644"
    content: |
      # OPENAPPSEC - WAF BONUS +2 POINTS, mode LOCAL / STANDALONE exclusivement.
      # EMPLACEMENT RESERVE : PAS une installation fonctionnelle du WAF.
      # Doit proteger l entree HTTP(S) en lien avec Traefik, sans dependre du
      # tableau de bord SaaS Check Point Infinity.
      # Le vrai montage exige le Compose/agent correspondant a la version
      # de Traefik et au profil standalone de l editeur.
      # Prevoir fichier de politique locale, par exemple:
      #   /opt/GroupeC/OpenAppsec/local_policy.yaml
      # et montage de politique dans l agent (emplacement adapte a l image).
      # IMPORTANT: le Traefik initial utilise le fournisseur de fichiers
      # (aucun Docker socket). Etudier la methode officielle d integration WAF
      # avant de modifier ce choix de securite.
      # Aucun jeton SaaS, aucun mot de passe fixe dans GitHub.
      # Reseau: GroupeC-exposition en frontal / point d entree selon montage;
      # ne PAS connecter WAF directement a PostgreSQL (GroupeC-donnees).
      # Tests requis pour le bonus: trafic normal OK, requete malveillante
      # de laboratoire detectee ou bloquee, journaux et regles locales visibles.
      # En cas de difficulte, laisser DESACTIVE : ce composant n est PAS requis.

  # ------------------------------------------------------------------------
  # FICHIER EXEMPLE ENV - ne contient aucun mot de passe
  # ------------------------------------------------------------------------
  - path: /opt/GroupeC/.env.example
    owner: root:root
    permissions: "0644"
    content: |
      # Exemple partageable : aucune valeur secrete n est incluse.
      # Les mots de passe sont generes localement par /opt/GroupeC/deploy.sh.
      POSTGRES_HOST=postgres
      POSTGRES_PORT=5432
      MOODLE_DB=moodle
      MOODLE_USER=moodle
      KEYCLOAK_DB=keycloak
      KEYCLOAK_USER=keycloak
      DRUPAL_DB=drupal
      DRUPAL_USER=drupal
      N8N_DB=n8n
      N8N_USER=n8n
      OPENCAST_DB=opencast
      OPENCAST_USER=opencast
      # REDIS utilise son propre secret local, sans instance PostgreSQL.
      # GRAFANA et LOKI: pas de base SQL supplementaire prevue.
      # Les images ne supportent pas toutes *_PASSWORD_FILE: adapter service par service.

  # ------------------------------------------------------------------------
  # ETAPE 3 - deploiement et VERIFICATIONS automatiques jusqu a PostgreSQL
  # ------------------------------------------------------------------------
  - path: /opt/GroupeC/deploy.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # CR465 - Deploiement Rootless reproductible, base commune GroupeC.
      # Etape 3 de runcmd: seulement apres installation et activation de Rootless.
      set -euo pipefail
      DOCKER_USER=ubuntu
      USER_ID="$(id -u "$DOCKER_USER")"
      RUNTIME_DIR="/run/user/${USER_ID}"
      BUS_ADDRESS="unix:path=${RUNTIME_DIR}/bus"
      ROOT=/opt/GroupeC

      user_docker() {
        runuser -u "$DOCKER_USER" -- env \
          HOME="/home/${DOCKER_USER}" USER="$DOCKER_USER" LOGNAME="$DOCKER_USER" \
          XDG_RUNTIME_DIR="$RUNTIME_DIR" \
          DBUS_SESSION_BUS_ADDRESS="$BUS_ADDRESS" \
          DOCKER_HOST="unix://${RUNTIME_DIR}/docker.sock" \
          PATH="/usr/local/bin:/usr/bin:/bin" docker "$@"
      }

      # Bloquer tout deploiement si Docker rootful a ete utilise par erreur.
      user_docker info --format '{{json .SecurityOptions}}' | grep -q rootless || {
        echo 'ERREUR: Docker Rootless inactif' >&2; exit 1;
      }

      # Securite SSH: la cle du compte ubuntu est injectee par Multipass.
      # Aucune cle publique ni aucun mot de passe n est integre au YAML.
      /usr/sbin/sshd -t
      systemctl is-active --quiet ssh || { echo 'ERREUR: SSH inactif' >&2; exit 1; }

      # Toute la structure sous /opt/GroupeC (et non /opt/<service>).
      for folder in traefik traefik/dynamic traefik/certs traefik/auth \
        postgresql postgresql/initdb webtest moodle keycloak drupal n8n \
        portainer opencast redis grafana loki OpenAppsec secrets; do
        install -d -m 0755 "$ROOT/$folder"
      done

      # Secrets generes SUR LA VM, jamais dans le YAML, .env, GitHub ou la video.
      # Mots de passe SQL pour 5 services, plus dashboard/Portainer/Redis/Grafana.
      # Redis, Loki et Grafana ne requierent pas de base PostgreSQL dans ce projet.
      install -d -o ubuntu -g ubuntu -m 0700 "$ROOT/secrets"
      for secret in postgres_admin_password moodle_db_password keycloak_db_password drupal_db_password n8n_db_password opencast_db_password traefik_dashboard_password portainer_admin_password redis_password grafana_admin_password; do
        file="$ROOT/secrets/$secret"
        if [ ! -s "$file" ]; then
          ( umask 077; openssl rand -hex 32 > "$file" )
        fi
        chown ubuntu:ubuntu "$file"
        # PostgreSQL lit les montages secrets via un UID interne different.
        # Le parent prive 0700 empeche la lecture par les autres comptes de la VM.
        chmod 0644 "$file"
      done
      chmod 0600 "$ROOT/secrets/traefik_dashboard_password"
      chmod 0600 "$ROOT/secrets/portainer_admin_password"

      # Compte admin Moodle et fichier env uniquement sur la VM (pas dans Git).
      if [ ! -s "$ROOT/secrets/moodle_admin_password" ]; then
        ( umask 077; openssl rand -hex 24 > "$ROOT/secrets/moodle_admin_password" )
      fi
      chown ubuntu:ubuntu "$ROOT/secrets/moodle_admin_password"
      chmod 0600 "$ROOT/secrets/moodle_admin_password"
      install -m 0700 -o ubuntu -g ubuntu -d "$ROOT/moodle"
      ( umask 077
        printf 'MOODLE_USERNAME=admin\nMOODLE_EMAIL=admin@groupec.test\nMOODLE_PASSWORD=%s\nDB_PASS=%s\n' \
          "$(cat "$ROOT/secrets/moodle_admin_password")" \
          "$(cat "$ROOT/secrets/moodle_db_password")" > "$ROOT/moodle/.env"
      )
      chown ubuntu:ubuntu "$ROOT/moodle/.env"
      chmod 0600 "$ROOT/moodle/.env"

      # Certificat autosigne HTTPS: local au laboratoire, 365 jours.
      # SAN explicites : curl ne fait pas correspondre *.localhost aux hotes locaux.
      # IMPORTANT: le fichier de cle est lisible par le conteneur Traefik rootless.
      install -d -m 0700 -o ubuntu -g ubuntu "$ROOT/traefik/certs"
      if [ ! -s "$ROOT/traefik/certs/local.crt" ] || [ ! -s "$ROOT/traefik/certs/local.key" ]; then
        openssl req -x509 -nodes -days 365 -newkey rsa:3072 -sha256 \
          -keyout "$ROOT/traefik/certs/local.key" \
          -out "$ROOT/traefik/certs/local.crt" \
          -subj '/CN=demo.localhost' \
          -addext 'subjectAltName=DNS:localhost,DNS:demo.localhost,DNS:dashboard.localhost,DNS:moodle.localhost,DNS:portainer.localhost,DNS:portainer.groupec.test,DNS:grafana.groupec.test,IP:127.0.0.1' \
          >/dev/null 2>&1
      fi
      chown ubuntu:ubuntu "$ROOT/traefik/certs/local.crt" "$ROOT/traefik/certs/local.key"
      chmod 0644 "$ROOT/traefik/certs/local.crt"
      chmod 0600 "$ROOT/traefik/certs/local.key"

      # Dashboard Traefik : protection BasicAuth par hash BCrypt, mot de passe secret.
      install -d -m 0700 -o ubuntu -g ubuntu "$ROOT/traefik/auth"
      if [ ! -s "$ROOT/traefik/auth/users.htpasswd" ]; then
        htpasswd -iBc "$ROOT/traefik/auth/users.htpasswd" admin < "$ROOT/secrets/traefik_dashboard_password" >/dev/null
      fi
      chown ubuntu:ubuntu "$ROOT/traefik/auth/users.htpasswd"
      chmod 0600 "$ROOT/traefik/auth/users.htpasswd"

      # 3 reseaux communs EXTERNES: separation des flux.
      for network in GroupeC-exposition GroupeC-applicatif; do
        if ! user_docker network inspect "$network" >/dev/null 2>&1; then
          user_docker network create --driver bridge "$network"
        fi
      done
      if ! user_docker network inspect GroupeC-donnees >/dev/null 2>&1; then
        user_docker network create --driver bridge --internal GroupeC-donnees
      fi
      [ "$(user_docker network inspect GroupeC-donnees --format '{{.Internal}}')" = true ] || {
        echo 'ERREUR: reseau GroupeC-donnees non internal' >&2; exit 1;
      }

      # La syntaxe des 4 Compose fonctionnels est controlee avant execution.
      for service in postgresql traefik webtest portainer moodle; do
        user_docker compose -f "$ROOT/$service/docker-compose.yml" config --quiet
      done

      # Les autres applications ne sont pas encore deployees.
      # Les gabarits restent commentes; seule la console Portainer est ajoutee.
      user_docker compose -f "$ROOT/postgresql/docker-compose.yml" up -d
      user_docker compose -f "$ROOT/traefik/docker-compose.yml" up -d
      user_docker compose -f "$ROOT/webtest/docker-compose.yml" up -d
      user_docker compose -f "$ROOT/portainer/docker-compose.yml" up -d

      # Validation Portainer via Traefik: conteneur running et API HTTP 200.
      portainer_ready=no
      for i in $(seq 1 45); do
        if user_docker compose -f "$ROOT/portainer/docker-compose.yml" ps --status running --services | grep -qx portainer; then
          http_code="$(curl --noproxy '*' -sS -o /dev/null -w '%{http_code}' \
            --cacert "$ROOT/traefik/certs/local.crt" \
            --resolve portainer.localhost:4443:127.0.0.1 \
            https://portainer.localhost:4443/api/system/status || true)"
          if [ "$http_code" = 200 ]; then
            portainer_ready=yes
            break
          fi
        fi
        sleep 2
      done
      [ "$portainer_ready" = yes ] || {
        echo 'ERREUR: Portainer ou son routage HTTPS ne repond pas (HTTP 200 attendu)' >&2; exit 1;
      }

      # Portainer ne doit PAS publier de port hote ni rejoindre le reseau de donnees.
      portainer_id="$(user_docker compose -f "$ROOT/portainer/docker-compose.yml" ps -q portainer)"
      [ -n "$portainer_id" ] || { echo 'ERREUR: conteneur Portainer introuvable' >&2; exit 1; }
      [ -z "$(user_docker port "$portainer_id")" ] || {
        echo 'ERREUR: Portainer publie un port direct sur la VM' >&2; exit 1;
      }
      user_docker inspect -f '{{json .NetworkSettings.Networks}}' "$portainer_id" | grep -q GroupeC-applicatif || {
        echo 'ERREUR: Portainer absent du reseau applicatif' >&2; exit 1;
      }
      if user_docker inspect -f '{{json .NetworkSettings.Networks}}' "$portainer_id" | grep -q GroupeC-donnees; then
        echo 'ERREUR: Portainer ne doit pas rejoindre le reseau de donnees' >&2; exit 1;
      fi

      # Attendre les cinq bases (Opencast optionnel compris) ET leurs proprietaires.
      ready=no
      for i in $(seq 1 90); do
        count="$(user_docker compose -f "$ROOT/postgresql/docker-compose.yml" exec -T postgres \
          psql -U postgres -d postgres -tAc \
          "SELECT count(*) FROM pg_database WHERE datname IN ('moodle','keycloak','drupal','n8n','opencast')" 2>/dev/null || true)"
        if [ "$count" = 5 ]; then ready=yes; break; fi
        sleep 2
      done
      [ "$ready" = yes ] || { echo 'ERREUR: PostgreSQL n a pas cree les 5 bases' >&2; exit 1; }

      # Verifier que les cinq roles se sont vus attribuer leur propre base.
      correct_owners="$(user_docker compose -f "$ROOT/postgresql/docker-compose.yml" exec -T postgres \
        psql -U postgres -d postgres -tAc \
        "SELECT count(*) FROM pg_database WHERE datname IN ('moodle','keycloak','drupal','n8n','opencast') AND datname=pg_get_userbyid(datdba)" 2>/dev/null || true)"
      [ "$correct_owners" = 5 ] || { echo 'ERREUR: proprietaires des bases non conformes' >&2; exit 1; }

      # Demarrer Moodle uniquement apres la creation de la base et du role moodle.
      user_docker compose -f "$ROOT/moodle/docker-compose.yml" up -d
      # Validation stricte: on SUIT les redirections (-L) et on exige un 200 final
      # sur la page de connexion. Une boucle de redirection (mauvais sslproxy)
      # fait echouer ce test au lieu d etre masquee par un simple 303.
      moodle_ready=no
      for i in $(seq 1 90); do
        code="$(curl --noproxy '*' -L --max-redirs 5 -sS -o /dev/null -w '%{http_code}' \
          --cacert "$ROOT/traefik/certs/local.crt" \
          --resolve moodle.localhost:4443:127.0.0.1 \
          https://moodle.localhost:4443/login/index.php || true)"
        if [ "$code" = 200 ]; then
          moodle_ready=yes
          break
        fi
        sleep 5
      done
      [ "$moodle_ready" = yes ] || { echo 'ERREUR: Moodle ne repond pas en HTTPS (200 attendu sur /login)' >&2; exit 1; }

      # Controles de durcissement du conteneur Moodle.
      moodle_id="$(user_docker compose -f "$ROOT/moodle/docker-compose.yml" ps -q moodle)"
      [ -n "$moodle_id" ] || { echo 'ERREUR: conteneur Moodle introuvable' >&2; exit 1; }
      [ -z "$(user_docker port "$moodle_id")" ] || {
        echo 'ERREUR: Moodle publie un port direct sur la VM' >&2; exit 1;
      }
      if user_docker inspect -f '{{json .NetworkSettings.Networks}}' "$moodle_id" | grep -q GroupeC-exposition; then
        echo 'ERREUR: Moodle ne doit pas rejoindre le reseau exposition' >&2; exit 1;
      fi
      user_docker inspect -f '{{json .HostConfig.CapDrop}}' "$moodle_id" | grep -qi all || {
        echo 'ERREUR: cap_drop ALL absent sur Moodle' >&2; exit 1;
      }
      user_docker inspect -f '{{json .HostConfig.SecurityOpt}}' "$moodle_id" | grep -q no-new-privileges || {
        echo 'ERREUR: no-new-privileges absent sur Moodle' >&2; exit 1;
      }
      moodle_uid="$(user_docker exec "$moodle_id" id -u)"
      [ "$moodle_uid" != 0 ] || { echo 'ERREUR: Moodle s execute en root' >&2; exit 1; }

      # Durcissement applicatif Moodle par CLI (idempotent, rejouable).
      # find gere les deux arborescences (avec ou sans dossier public/ selon la version).
      moodle_cfg="$(user_docker exec "$moodle_id" sh -c 'find /var/www/html -path "*admin/cli/cfg.php" | head -1')"
      [ -n "$moodle_cfg" ] || { echo 'ERREUR: admin/cli/cfg.php Moodle introuvable' >&2; exit 1; }
      # forcelogin        : aucun contenu visible sans authentification
      # cookiesecure      : cookie de session envoye uniquement en HTTPS
      # passwordpolicy    : politique de mot de passe active
      # lockout*          : verrouillage apres 5 echecs pendant 30 min
      # sessiontimeout    : expiration de session apres 2 h d inactivite
      # webserviceprotocols : REST seulement (suffisant pour n8n)
      # L auto-inscription (registerauth) reste desactivee par defaut.
      for kv in forcelogin=1 cookiesecure=1 passwordpolicy=1 \
        lockoutthreshold=5 lockoutwindow=1800 lockoutduration=1800 \
        sessiontimeout=7200 webserviceprotocols=rest; do
        user_docker exec "$moodle_id" php "$moodle_cfg" --name="${kv%%=*}" --set="${kv#*=}"
      done
      echo 'SUCCES: Moodle durci (conteneur + parametres applicatifs)'

      # 1) Ping Traefik; 2) HTTPS Nginx; 3) dashboard refuse les anonymes.
      # --resolve evite de dependre de la resolution .localhost dans la VM.
      ready=no
      for i in $(seq 1 45); do
        if curl --noproxy '*' -fsS http://127.0.0.1:8080/ping | grep -qx OK && \
           curl --noproxy '*' -fsS --cacert "$ROOT/traefik/certs/local.crt" \
             --resolve demo.localhost:4443:127.0.0.1 \
             https://demo.localhost:4443/ | grep -qi 'Welcome to nginx' && \
           [ "$(curl --noproxy '*' -sS -o /dev/null -w '%{http_code}' \
             --cacert "$ROOT/traefik/certs/local.crt" \
             --resolve dashboard.localhost:4443:127.0.0.1 \
             https://dashboard.localhost:4443/dashboard/)" = 401 ]; then
          ready=yes; break
        fi
        sleep 2
      done
      [ "$ready" = yes ] || {
        echo 'ERREUR: validation Traefik HTTPS, ping ou dashboard protegee' >&2; exit 1;
      }

      echo 'SUCCES: Docker Rootless, SSH, reseaux, Traefik HTTPS, Nginx, PostgreSQL, Portainer CE et Moodle valides.'
      echo 'NOTE: Keycloak, Drupal, n8n et Grafana restent a integrer.'

  # ------------------------------------------------------------------------
  # MODE D EMPLOI - collegues, reseaux, secrets, tests
  # ------------------------------------------------------------------------
  - path: /opt/GroupeC/README-INTEGRATION.txt
    owner: root:root
    permissions: "0644"
    content: |
      CR465 - BASE GROUPEC : FICHIER D INTEGRATION
      ==============================================

      ETAT DE LA BASE APRES UNE VM NEUVE:
      - SSH installe, authentification par cle (Multipass injecte sa cle).
      - Docker rootless (utilisateur ubuntu, demon systemd --user, linger).
      - Docker Compose.
      - Reseaux: GroupeC-exposition; GroupeC-applicatif; GroupeC-donnees (internal).
      - Traefik HTTPS autosigne, file provider, aucun socket Docker monte.
      - Tableau de bord: route dashboard.localhost, authentification BasicAuth.
      - Nginx TEMPORAIRE webtest pour prouver le routage HTTPS.
      - PostgreSQL 17, 5 bases et 5 comptes: moodle, keycloak, drupal, n8n, opencast.
      - Opencast reste non installe, mais son role/sa base sont provisionnes.
      - Portainer CE: service actif via Traefik; administration Docker Rootless.
      - Secret admin Portainer au premier demarrage, conserve localement dans /opt/GroupeC/secrets/.
      - Secret admin et secret distinct pour chaque compte SQL (PAS de valeur fixe).
      - Mots de passe reserves pour Redis et Grafana, sans activation des services.
      - Moodle deploye et durci: non-root, cap_drop ALL, no-new-privileges,
        limites RAM/CPU/PIDs, /tmp noexec, journaux bornes, healthcheck,
        en-tetes HTTPS + limitation de debit Traefik (/login plus strict),
        forcelogin, verrouillage de compte, cookies securises, REST seul.
      - Keycloak, Drupal, n8n et Grafana ne sont pas encore deployes.
      - Risque residuel Moodle: DB_PASS passe en variable d environnement
        (visible par docker inspect/Portainer); l image ne gere pas *_FILE.
        Attenuation: .env en 0600, acces Portainer reserve aux admins.

      NOMS ET RESEAUX:
      - GroupeC-exposition : Traefik seulement.
      - GroupeC-applicatif : Traefik, Nginx, Portainer et futurs services web.
      - GroupeC-donnees : PostgreSQL et applications ayant une BD.
      - Les applications connectent a la BD via hote postgres:5432.
      - Portainer et Traefik ne necessitent pas de bases PostgreSQL.
      - OpenAppSec WAF (+2 pts) et Redis sont BONUS; Opencast est OPTIONNEL.
      - Grafana/Loki sont recommandes, mais non indispensables.

      CONFIGURATIONS COTE COLLEGUES:
      - /opt/GroupeC/moodle/docker-compose.yml : Moodle integre, lance automatiquement.
      - /opt/GroupeC/moodle/.env : genere localement, ne pas publier.
      - /opt/GroupeC/secrets/moodle_admin_password : secret admin Moodle local.
      - /opt/GroupeC/keycloak/docker-compose.yml : ajouter vrai Compose + config Keycloak.
      - /opt/GroupeC/drupal/docker-compose.yml : ajouter vrai Compose + Commerce.
      - /opt/GroupeC/n8n/docker-compose.yml : ajouter vrai Compose + workflow.
      - /opt/GroupeC/portainer/docker-compose.yml : Portainer CE fonctionnel (Compose fourni).
      - /opt/GroupeC/opencast/docker-compose.yml : OPTIONNEL, BDD opencast precree.
      - /opt/GroupeC/redis/docker-compose.yml : BONUS cache, secret redis_password.
      - /opt/GroupeC/grafana/docker-compose.yml : RECOMMANDE, mot de passe admin secret.
      - /opt/GroupeC/loki/docker-compose.yml : RECOMMANDE, stockage logs.
      - /opt/GroupeC/OpenAppsec/docker-compose.yml : BONUS +2 WAF standalone local.
      - Moodle et Portainer sont deployes; Keycloak, Drupal et n8n restent des gabarits.
      - Ajouter ensuite la route HTTPS correspondante dans /opt/GroupeC/traefik/dynamic/routes.yaml.
      - Pour chaque application qui a une base, joindre GroupeC-applicatif ET GroupeC-donnees.
      - Redis sur GroupeC-donnees uniquement. Loki/Grafana sur reseau partage sans port public.
      - Ne pas monter le socket rootless dans les services sans justification.
      - Le WAF bonus doit rester standalone/local, sans gestion cloud obligatoire.
      - Dans chaque Compose independant declarer ces reseaux comme external: true.
      - Pour les secrets: voir /opt/GroupeC/secrets/<app>_db_password sur la VM,
        NE PAS copier ces fichiers sur GitHub ou dans le code.
      - Les moteurs applicatifs n acceptent pas tous *_PASSWORD_FILE.
        Adapter l image avec un point d entree ou mecanisme compatible.
      - Le contenu des 5 bases est initialise au PREMIER boot du volume PostgreSQL.

      ACCES DE LABORATOIRE (depuis la VM uniquement):
      - HTTP -> HTTPS: http://demo.localhost:8081/ -> https://demo.localhost:4443/
      - HTTPS demo: https://demo.localhost:4443/ (certificat local autosigne)
      - Traefik ping: http://127.0.0.1:8080/ping
      - Dashboard Traefik: https://dashboard.localhost:4443/dashboard/
      - Moodle (dans la VM): https://moodle.localhost:4443/
        Admin Moodle: mot de passe local /opt/GroupeC/secrets/moodle_admin_password
      - Portainer (dans la VM): https://portainer.localhost:4443/
        Admin Portainer: mot de passe local /opt/GroupeC/secrets/portainer_admin_password
        Le compte admin est initialise au premier demarrage seulement.
      - Portainer (depuis Windows, si reseau/DNS/UFW configures):
        https://portainer.groupec.test:4443/
      - Grafana (route Traefik prete; service NON installe):
        https://grafana.groupec.test:4443/
        Nom d utilisateur: admin
        Mot de passe sur la VM: /opt/GroupeC/secrets/traefik_dashboard_password
        Ce fichier est protege. Ne jamais publier le secret dans un rapport.
      - Ping 8080 et HTTP 8081 ecoutes sur 127.0.0.1 seulement.
      - HTTPS 4443 ecoute sur les interfaces VM; UFW doit limiter l acces aux IP autorisees.
      - Pour le test Windows: associer portainer.groupec.test et grafana.groupec.test
        a l IPv4 de la VM dans hosts/DNS, puis autoriser l IP du PC dans UFW.
      - Exemple temporaire dans Ubuntu: sudo ufw allow from <IP_PC> to any port 4443 proto tcp
      - Ne pas exposer ce laboratoire sur Internet. Certificat autosigne a approuver localement.
      - Un collegue distant n a pas acces sans connectivite reseau (VPN/reseau VM).

      TESTS APRES PREMIER BOOT (dans Multipass):
        sudo cloud-init status --wait
        docker context show
        docker info --format '{{json .SecurityOptions}}'
        docker ps
        docker network inspect GroupeC-donnees --format '{{.Internal}}'
        sudo ss -ltpn | grep -E ':(22|8080|8081|4443) '
        curl --noproxy '*' -fsS http://127.0.0.1:8080/ping
        curl --noproxy '*' --cacert /opt/GroupeC/traefik/certs/local.crt \
          --resolve demo.localhost:4443:127.0.0.1 https://demo.localhost:4443/
        docker compose -f /opt/GroupeC/postgresql/docker-compose.yml ps
        docker compose -f /opt/GroupeC/portainer/docker-compose.yml ps
        docker compose -f /opt/GroupeC/moodle/docker-compose.yml ps
        docker compose -f /opt/GroupeC/moodle/docker-compose.yml exec moodle id
        docker inspect $(docker compose -f /opt/GroupeC/moodle/docker-compose.yml ps -q moodle) \
          --format '{{.HostConfig.CapDrop}} {{.HostConfig.SecurityOpt}} {{.HostConfig.Memory}} {{.State.Health.Status}}'
        curl --noproxy '*' --cacert /opt/GroupeC/traefik/certs/local.crt \
          --resolve portainer.localhost:4443:127.0.0.1 https://portainer.localhost:4443/api/system/status
        docker compose -f /opt/GroupeC/postgresql/docker-compose.yml exec -T postgres \
          psql -U postgres -d postgres -c \
          "SELECT datname, pg_get_userbyid(datdba) AS owner FROM pg_database WHERE datname IN ('moodle','keycloak','drupal','n8n','opencast');"

      ATTENTION:
      - Ne pas executer ce cloud-init sur la VM originale deja en service.
      - Creer une VM test NEUVE. La creation de volumes/secrets se fait au premier boot.
      - Les certificats autosignes ne sont pas reconnus par les navigateurs publics.
      - Le socket Docker Rootless donne un pouvoir important: pas d acces collectif sans politique.
      - Authentification SSH par cle et pas de mot de passe SSH.
      - Pour ajouter les services applicatifs, il faut plus de RAM/disque que la base.

# ============================================================================
# RUNCMD : trois etapes BLOQUANTES, controlees, sans lancement des gabarits.
# ============================================================================
runcmd:
  # 1) Preparation SSH / Docker Engine / pare-feu / desactivation docker rootful.
  - [bash, /usr/local/sbin/prepare-docker-rootless.sh]
  # 2) Docker Rootless comme service systemd --user avec linger et controle.
  - [bash, /usr/local/sbin/activate-docker-rootless.sh]
  # 3) Secrets, certificats, reseaux, Traefik, Nginx, PostgreSQL, Portainer et Moodle.
  - [bash, /opt/GroupeC/deploy.sh]

final_message: 'CR465 GroupeC : cloud-init termine ; verifier les services avec sudo cloud-init status --wait et docker ps.'
