  # ------------------------------------------------------------------------
  # SECTION BONUS +2 POINTS - OPENAPPSEC (WAF local) : NON DEPLOYE
  # ------------------------------------------------------------------------
- path: /opt/GroupeC/OpenAppsec/docker-compose.yml
  owner: root:root
  permissions: !!str "0644"
  content: |
    # OPENAPPSEC - WAF BONUS +2 POINTS, mode LOCAL / STANDALONE exclusivement.
    # EMPLACEMENT RESERVE : PAS une installation fonctionnelle du WAF.
    # Doit proteger l entree HTTP(S) en lien avec Traefik, sans dependre du
    # tableau de bord SaaS Check Point Infinity.
    # Le vrai montage exige le Compose/agent correspondant a la version
    # de Traefik et au profil standalone de l editeur.
    # Prevoir fichier de politique locale, par exemple:
    #   /opt/GroupeC/OpenAppsec/local_policy.yaml
    # et montage de politique dans l agent (emplacement adapte a l image).
    # IMPORTANT: le Traefik initial utilise le fournisseur de fichiers
    # (aucun Docker socket). Etudier la methode officielle d integration WAF
    # avant de modifier ce choix de securite.
    # Aucun jeton SaaS, aucun mot de passe fixe dans GitHub.
    # Reseau: GroupeC-exposition en frontal / point d entree selon montage;
    # ne PAS connecter WAF directement a PostgreSQL (GroupeC-donnees).
    # Tests requis pour le bonus: trafic normal OK, requete malveillante
    # de laboratoire detectee ou bloquee, journaux et regles locales visibles.
    # En cas de difficulte, laisser DESACTIVE : ce composant n est PAS requis.

  # ------------------------------------------------------------------------
  # FICHIER EXEMPLE ENV - ne contient aucun mot de passe
  # ------------------------------------------------------------------------
- path: /opt/GroupeC/.env.example
  owner: root:root
  permissions: !!str "0644"
  content: |
    # Exemple partageable : aucune valeur secrete n est incluse.
    # Les mots de passe sont generes localement par /opt/GroupeC/deploy.sh.
    POSTGRES_HOST=postgres
    POSTGRES_PORT=5432
    MOODLE_DB=moodle
    MOODLE_USER=moodle
    KEYCLOAK_DB=keycloak
    KEYCLOAK_USER=keycloak
    DRUPAL_DB=drupal
    DRUPAL_USER=drupal
    N8N_DB=n8n
    N8N_USER=n8n
    OPENCAST_DB=opencast
    OPENCAST_USER=opencast
    # REDIS utilise son propre secret local, sans instance PostgreSQL.
    # GRAFANA et LOKI: pas de base SQL supplementaire prevue.
    # Les images ne supportent pas toutes *_PASSWORD_FILE: adapter service par service.

  # ------------------------------------------------------------------------
  # ETAPE 3 - deploiement et VERIFICATIONS automatiques jusqu a PostgreSQL
  # ------------------------------------------------------------------------
- path: /opt/GroupeC/deploy.sh
  owner: root:root
  permissions: !!str "0755"
  content: |
    #!/usr/bin/env bash
    # CR465 - Deploiement Rootless reproductible, base commune GroupeC.
    # Etape 3 de runcmd: seulement apres installation et activation de Rootless.
    set -euo pipefail
    DOCKER_USER=ubuntu
    USER_ID="$(id -u "$DOCKER_USER")"
    RUNTIME_DIR="/run/user/${USER_ID}"
    BUS_ADDRESS="unix:path=${RUNTIME_DIR}/bus"
    ROOT=/opt/GroupeC

    user_docker() {
      runuser -u "$DOCKER_USER" -- env \
        HOME="/home/${DOCKER_USER}" USER="$DOCKER_USER" LOGNAME="$DOCKER_USER" \
        XDG_RUNTIME_DIR="$RUNTIME_DIR" \
        DBUS_SESSION_BUS_ADDRESS="$BUS_ADDRESS" \
        DOCKER_HOST="unix://${RUNTIME_DIR}/docker.sock" \
        PATH="/usr/local/bin:/usr/bin:/bin" docker "$@"
    }

    # Bloquer tout deploiement si Docker rootful a ete utilise par erreur.
    user_docker info --format '{{json .SecurityOptions}}' | grep -q rootless || {
      echo 'ERREUR: Docker Rootless inactif' >&2; exit 1;
    }

    # Securite SSH: la cle du compte ubuntu est injectee par Multipass.
    # Aucune cle publique ni aucun mot de passe n est integre au YAML.
    /usr/sbin/sshd -t
    systemctl is-active --quiet ssh || { echo 'ERREUR: SSH inactif' >&2; exit 1; }

    # Toute la structure sous /opt/GroupeC (et non /opt/<service>).
    for folder in traefik traefik/dynamic traefik/certs traefik/auth \
      postgresql postgresql/initdb webtest moodle keycloak drupal drupal/scripts \
        drupal/modules drupal/modules/groupec_n8n drupal/modules/groupec_n8n/src \
        drupal/modules/groupec_n8n/src/EventSubscriber drupal/modules/groupec_n8n/src/Controller n8n n8n/workflows \
      portainer opencast redis observabilite observabilite/loki observabilite/alloy \
      observabilite/grafana observabilite/grafana/provisioning \
      observabilite/grafana/provisioning/datasources OpenAppsec secrets; do
      install -d -m 0755 "$ROOT/$folder"
    done

    # Secrets generes SUR LA VM, jamais dans le YAML, .env, GitHub ou la video.
    # Mots de passe SQL pour 5 services, plus dashboard/Portainer/Redis/Grafana.
    # Redis, Loki et Grafana ne requierent pas de base PostgreSQL dans ce projet.
    install -d -o ubuntu -g ubuntu -m 0700 "$ROOT/secrets"
    for secret in postgres_admin_password moodle_db_password keycloak_db_password drupal_db_password n8n_db_password opencast_db_password traefik_dashboard_password portainer_admin_password redis_password grafana_admin_password; do
      file="$ROOT/secrets/$secret"
      if [ ! -s "$file" ]; then
        ( umask 077; openssl rand -hex 32 | tr -d '\r\n' > "$file" )
      fi
      chown ubuntu:ubuntu "$file"
      # PostgreSQL lit les montages secrets via un UID interne different.
      # Le parent prive 0700 empeche la lecture par les autres comptes de la VM.
      chmod 0644 "$file"
    done
    chmod 0600 "$ROOT/secrets/traefik_dashboard_password"
    chmod 0600 "$ROOT/secrets/portainer_admin_password"
    # Compatible avec Grafana user 472:0 sous Docker Rootless : lecture via groupe 0.
    # Verifier a nouveau par un test de lecture apres deploiement.
    chmod 0640 "$ROOT/secrets/grafana_admin_password"

    # -----------------------------------------------------------------------
    # Keycloak / Moodle : secrets nouveaux, controles et idempotents.
    # Ces fichiers restent uniquement sur la VM (jamais dans ce cloud-init).
    # -----------------------------------------------------------------------
    install -d -m 0700 -o ubuntu -g ubuntu "$ROOT/moodle" "$ROOT/keycloak"
    for s in moodle_admin_password keycloak_admin_password moodle_oidc_client_secret keycloak_permanent_admin_password etudiant_test_password n8n_admin_password drupal_admin_password n8n_webhook_token n8n_encryption_key; do
      f="$ROOT/secrets/$s"
      if [ ! -s "$f" ]; then
        ( umask 077; openssl rand -hex 32 | tr -d '\r\n' > "$f" )
      fi
      chown ubuntu:ubuntu "$f"
      # Docker Rootless monte ces fichiers en secrets Compose avec un UID
      # correspondant a root dans le conteneur. Les services n8n (node)
      # et Drupal (www-data) doivent pouvoir lire leur propre secret.
      # Le repertoire hote /opt/GroupeC/secrets reste prive (mode 0700).
      if [[ "$s" == n8n_encryption_key || "$s" == n8n_webhook_token ]]; then
        chmod 0644 "$f"
      else
        chmod 0600 "$f"
      fi
    done
    # Moodle Alpine utilise DB_PASS, pas DB_PASS_FILE.
    # Format .env lisible par Compose, restreint a ubuntu.
    ( umask 077
      printf 'MOODLE_USERNAME=admin\nMOODLE_EMAIL=admin@groupec.test\nMOODLE_PASSWORD=%s\nDB_PASS=%s\n' \
        "$(cat "$ROOT/secrets/moodle_admin_password")" \
        "$(cat "$ROOT/secrets/moodle_db_password")" > "$ROOT/moodle/.env"
      printf 'KC_DB_PASSWORD=%s\nKC_BOOTSTRAP_ADMIN_PASSWORD=%s\n' \
        "$(cat "$ROOT/secrets/keycloak_db_password")" \
        "$(cat "$ROOT/secrets/keycloak_admin_password")" > "$ROOT/keycloak/.env"
    )
    chown ubuntu:ubuntu "$ROOT/moodle/.env" "$ROOT/keycloak/.env"
    chmod 0600 "$ROOT/moodle/.env" "$ROOT/keycloak/.env"
    # Inserer le secret OIDC dans l'import Keycloak, jamais dans GitHub.
    # Conserver le meme secret/realm sur les executions suivantes.
    if [ ! -s "$ROOT/keycloak/groupec-realm.json" ]; then
      ( umask 077
        jq --arg sec "$(cat "$ROOT/secrets/moodle_oidc_client_secret")" \
          '.clients |= map(if .clientId == "moodle" then .secret = $sec else . end)' \
          "$ROOT/keycloak/groupec-realm.template.json" \
          > "$ROOT/keycloak/groupec-realm.json"
      )
    fi
    chown ubuntu:ubuntu "$ROOT/keycloak/groupec-realm.json"
    # L'UID non-root de Keycloak doit pouvoir lire le montage RO.
    # Repertoire parent prive 0700 bloque les autres utilisateurs de la VM.
    chmod 0644 "$ROOT/keycloak/groupec-realm.json"

    # Certificat autosigne HTTPS: local au laboratoire, 365 jours.
    # SAN explicites : curl ne fait pas correspondre *.localhost aux hotes locaux.
    # IMPORTANT: le fichier de cle est lisible par le conteneur Traefik rootless.
    install -d -m 0700 -o ubuntu -g ubuntu "$ROOT/traefik/certs"
    if [ ! -s "$ROOT/traefik/certs/local.crt" ] || [ ! -s "$ROOT/traefik/certs/local.key" ]; then
      openssl req -x509 -nodes -days 365 -newkey rsa:3072 -sha256 \
        -keyout "$ROOT/traefik/certs/local.key" \
        -out "$ROOT/traefik/certs/local.crt" \
        -subj '/CN=demo.localhost' \
        -addext 'subjectAltName=DNS:localhost,DNS:demo.localhost,DNS:dashboard.localhost,DNS:portainer.localhost,DNS:portainer.groupec.test,DNS:grafana.groupec.test,DNS:moodle.groupec.test,DNS:keycloak.groupec.test,DNS:moodle.localhost,DNS:keycloak.localhost,DNS:drupal.groupec.test,DNS:n8n.groupec.test,IP:127.0.0.1' \
        >/dev/null 2>&1
    fi
    chown ubuntu:ubuntu "$ROOT/traefik/certs/local.crt" "$ROOT/traefik/certs/local.key"
    chmod 0644 "$ROOT/traefik/certs/local.crt"
    chmod 0600 "$ROOT/traefik/certs/local.key"
    cat /etc/ssl/certs/ca-certificates.crt "$ROOT/traefik/certs/local.crt" > "$ROOT/moodle/ca-bundle.crt"
    chown ubuntu:ubuntu "$ROOT/moodle/ca-bundle.crt"
    chmod 0644 "$ROOT/moodle/ca-bundle.crt"

    # Dashboard Traefik : protection BasicAuth par hash BCrypt, mot de passe secret.
    install -d -m 0700 -o ubuntu -g ubuntu "$ROOT/traefik/auth"
    if [ ! -s "$ROOT/traefik/auth/users.htpasswd" ]; then
      htpasswd -iBc "$ROOT/traefik/auth/users.htpasswd" admin < "$ROOT/secrets/traefik_dashboard_password" >/dev/null
    fi
    chown ubuntu:ubuntu "$ROOT/traefik/auth/users.htpasswd"
    chmod 0600 "$ROOT/traefik/auth/users.htpasswd"

    # 4 reseaux communs EXTERNES: separation des flux.
    # Reseau applicatif fixe pour que la resolution Keycloak->Traefik soit stable.
    # Le sous-reseau choisi ne doit pas chevaucher un reseau VPN ou de l'hote.
    for network in GroupeC-exposition; do
      if ! user_docker network inspect "$network" >/dev/null 2>&1; then
        user_docker network create --driver bridge "$network"
      fi
    done
    if ! user_docker network inspect GroupeC-applicatif >/dev/null 2>&1; then
      user_docker network create --driver bridge --subnet 172.28.240.0/24 GroupeC-applicatif
    fi
    app_subnet="$(user_docker network inspect GroupeC-applicatif --format '{{(index .IPAM.Config 0).Subnet}}')"
    [ "$app_subnet" = '172.28.240.0/24' ] || {
      echo 'ERREUR: GroupeC-applicatif doit avoir le sous-reseau 172.28.240.0/24 pour le SSO' >&2; exit 1;
    }
    if ! user_docker network inspect GroupeC-donnees >/dev/null 2>&1; then
      user_docker network create --driver bridge --internal GroupeC-donnees
    fi
    [ "$(user_docker network inspect GroupeC-donnees --format '{{.Internal}}')" = true ] || {
      echo 'ERREUR: reseau GroupeC-donnees non internal' >&2; exit 1;
    }
    # Nouveau reseau reserve a Grafana/Loki/Alloy; Loki/Alloy non exposes sur l'hote.
    if ! user_docker network inspect GroupeC-observabilite >/dev/null 2>&1; then
      user_docker network create --driver bridge --internal GroupeC-observabilite
    fi
    [ "$(user_docker network inspect GroupeC-observabilite --format '{{.Internal}}')" = true ] || {
      echo 'ERREUR: reseau GroupeC-observabilite non internal' >&2; exit 1;
    }
    # Empreinte du chemin exact valide sur la base Docker Rootless de ubuntu.
    [ "$(user_docker info --format '{{.DockerRootDir}}')" = /home/ubuntu/.local/share/docker ] || {
      echo 'ERREUR: DockerRootDir different du montage de journaux attendu par Alloy' >&2; exit 1;
    }
    # Ne pas modifier le repertoire des journaux gere par Docker.

    # Verifier la configuration des 7 projets Compose avant demarrage.
    for service in postgresql traefik webtest portainer; do
      user_docker compose -f "$ROOT/$service/docker-compose.yml" config --quiet
    done

    for service in loki alloy grafana; do
      user_docker compose -f "$ROOT/observabilite/$service/docker-compose.yml" config --quiet
    done

    # Les deux services sont maintenant valides avec les 7 projets de base.
    for service in moodle keycloak; do
      user_docker compose -f "$ROOT/$service/docker-compose.yml" config --quiet
    done
    # Drupal et n8n sont valides dans la phase suivante du meme deploy.sh.

    # Les gabarits applicatifs restent commentes; Portainer et observabilite ajoutes.
    user_docker compose -f "$ROOT/postgresql/docker-compose.yml" up -d
    user_docker compose -f "$ROOT/traefik/docker-compose.yml" up -d
    user_docker compose -f "$ROOT/webtest/docker-compose.yml" up -d
    user_docker compose -f "$ROOT/portainer/docker-compose.yml" up -d

    # Validation Portainer via Traefik: conteneur running et API HTTP 200.
    portainer_ready=no
    for i in $(seq 1 45); do
      if user_docker compose -f "$ROOT/portainer/docker-compose.yml" ps --status running --services | grep -qx portainer; then
        http_code="$(curl --noproxy '*' -sS -o /dev/null -w '%{http_code}' \
          --cacert "$ROOT/traefik/certs/local.crt" \
          --resolve portainer.localhost:4443:127.0.0.1 \
          https://portainer.localhost:4443/api/system/status || true)"
        if [ "$http_code" = 200 ]; then
          portainer_ready=yes
          break
        fi
      fi
      sleep 2
    done
    [ "$portainer_ready" = yes ] || {
      echo 'ERREUR: Portainer ou son routage HTTPS ne repond pas (HTTP 200 attendu)' >&2; exit 1;
    }

    # Portainer ne doit PAS publier de port hote ni rejoindre le reseau de donnees.
    portainer_id="$(user_docker compose -f "$ROOT/portainer/docker-compose.yml" ps -q portainer)"
    [ -n "$portainer_id" ] || { echo 'ERREUR: conteneur Portainer introuvable' >&2; exit 1; }
    [ -z "$(user_docker port "$portainer_id")" ] || {
      echo 'ERREUR: Portainer publie un port direct sur la VM' >&2; exit 1;
    }
    user_docker inspect -f '{{json .NetworkSettings.Networks}}' "$portainer_id" | grep -q GroupeC-applicatif || {
      echo 'ERREUR: Portainer absent du reseau applicatif' >&2; exit 1;
    }
    if user_docker inspect -f '{{json .NetworkSettings.Networks}}' "$portainer_id" | grep -q GroupeC-donnees; then
      echo 'ERREUR: Portainer ne doit pas rejoindre le reseau de donnees' >&2; exit 1;
    fi

    # Attendre les cinq bases (Opencast optionnel compris) ET leurs proprietaires.
    ready=no
    for i in $(seq 1 90); do
      count="$(user_docker compose -f "$ROOT/postgresql/docker-compose.yml" exec -T postgres \
        psql -U postgres -d postgres -tAc \
        "SELECT count(*) FROM pg_database WHERE datname IN ('moodle','keycloak','drupal','n8n','opencast')" 2>/dev/null || true)"
      if [ "$count" = 5 ]; then ready=yes; break; fi
      sleep 2
    done
    [ "$ready" = yes ] || { echo 'ERREUR: PostgreSQL n a pas cree les 5 bases' >&2; exit 1; }

    # Verifier que les cinq roles se sont vus attribuer leur propre base.
    correct_owners="$(user_docker compose -f "$ROOT/postgresql/docker-compose.yml" exec -T postgres \
      psql -U postgres -d postgres -tAc \
      "SELECT count(*) FROM pg_database WHERE datname IN ('moodle','keycloak','drupal','n8n','opencast') AND datname=pg_get_userbyid(datdba)" 2>/dev/null || true)"
    [ "$correct_owners" = 5 ] || { echo 'ERREUR: proprietaires des bases non conformes' >&2; exit 1; }

    # 1) Ping Traefik; 2) HTTPS Nginx; 3) dashboard refuse les anonymes.
    # --resolve evite de dependre de la resolution .localhost dans la VM.
    ready=no
    for i in $(seq 1 45); do
      if curl --noproxy '*' -fsS http://127.0.0.1:8080/ping | grep -qx OK && \
         curl --noproxy '*' -fsS --cacert "$ROOT/traefik/certs/local.crt" \
           --resolve demo.localhost:4443:127.0.0.1 \
           https://demo.localhost:4443/ | grep -qi 'Welcome to nginx' && \
         [ "$(curl --noproxy '*' -sS -o /dev/null -w '%{http_code}' \
           --cacert "$ROOT/traefik/certs/local.crt" \
           --resolve dashboard.localhost:4443:127.0.0.1 \
           https://dashboard.localhost:4443/dashboard/)" = 401 ]; then
        ready=yes; break
      fi
      sleep 2
    done
    [ "$ready" = yes ] || {
      echo 'ERREUR: validation Traefik HTTPS, ping ou dashboard protegee' >&2; exit 1;
    }

    [ -d /home/ubuntu/.local/share/docker/containers ] || {
      echo 'ERREUR: repertoire de journaux Rootless absent' >&2; exit 1;
    }
    # OBSERVABILITE : demarrer Loki et attendre sa disponibilite.
    user_docker compose -f "$ROOT/observabilite/loki/docker-compose.yml" up -d

    # Attendre HTTP 200 sur /ready avant de demarrer Alloy et Grafana.
    # Loki reste accessible uniquement sur le reseau Docker interne.
    if ! user_docker run --rm --network GroupeC-observabilite \
        --entrypoint sh curlimages/curl:8.11.1 -c '
          i=0
          until curl --noproxy "*" -fsS -o /dev/null http://groupec-loki:3100/ready 2>/dev/null; do
            i=$((i + 1))
            if [ "$i" -ge 90 ]; then
              echo "ERREUR: Loki non pret apres 180 secondes" >&2
              exit 1
            fi
            sleep 2
          done
          echo "SUCCES: Loki est pret (HTTP 200 sur /ready)"
        '; then
      echo "ERREUR: Loki indisponible, deploiement interrompu" >&2
      exit 1
    fi

    # Loki est pret : demarrer Alloy puis Grafana.
    for service in alloy grafana; do
      user_docker compose -f "$ROOT/observabilite/$service/docker-compose.yml" up -d
    done

    # Verifier que les trois conteneurs restent actifs (et non seulement "created").
    for service in loki alloy grafana; do
      container="groupec-$service"
      running=no
      for i in $(seq 1 45); do
        if [ "$(user_docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null || true)" = true ]; then
          running=yes; break
        fi
        sleep 2
      done
      [ "$running" = yes ] || { echo "ERREUR: $container pas en cours d'execution" >&2; exit 1; }
    done
    # Acces a Grafana par Traefik en HTTPS (sans ouvrir le port 3000 de Grafana).
    grafana_ready=no
    for i in $(seq 1 90); do
      code="$(curl --noproxy '*' -sS -o /dev/null -w '%{http_code}' \
        --cacert "$ROOT/traefik/certs/local.crt" \
        --resolve grafana.groupec.test:4443:127.0.0.1 \
        https://grafana.groupec.test:4443/login || true)"
      if [ "$code" = 200 ]; then grafana_ready=yes; break; fi
      sleep 2
    done
    [ "$grafana_ready" = yes ] || {
      echo 'ERREUR: page Grafana /login inaccessible via Traefik en HTTPS' >&2; exit 1;
    }
    # La verification d'acces aux fichiers par Alloy, de Loki et de la datasource
    # Grafana demande un test de bout en bout APRES installation, voir README.
    echo 'SUCCES: base Rootless/Traefik/PostgreSQL/Portainer validee; Loki, Alloy et Grafana demarres, Grafana HTTPS 200.'
    # -----------------------------------------------------------------------
    # KEYCLOAK / MOODLE : nouveaux services, seulement apres les 7 de base.
    # En cas d'echec, aucun conteneur existant n'est recree/supprime ici.
    # -----------------------------------------------------------------------
    user_docker compose -f "$ROOT/keycloak/docker-compose.yml" up -d
    # Keycloak peut reconstruire sa configuration au premier lancement.
    # KEYCLOAK: maximum 8 minutes de disponibilite au premier demarrage.
    # Chaque tentative est limitee a 15 s et la connexion a 5 s.
    keycloak_ready=no
    keycloak_deadline=$((SECONDS + 480))
    while (( SECONDS < keycloak_deadline )); do
      code="$(curl --noproxy '*' --connect-timeout 5 --max-time 15 -sS -o /dev/null -w '%{http_code}' \
        --cacert "$ROOT/traefik/certs/local.crt" \
        --resolve keycloak.groupec.test:4443:127.0.0.1 \
        https://keycloak.groupec.test:4443/realms/groupec/.well-known/openid-configuration || true)"
      if [ "$code" = 200 ]; then keycloak_ready=yes; break; fi
      sleep 3
    done
    [ "$keycloak_ready" = yes ] || {
      echo 'ERREUR: timeout Keycloak: indisponible apres 480 secondes (inspecter docker logs)' >&2; exit 1;
    }
    # Valider le meme URL public depuis un conteneur du reseau applicatif.
    # L'alias reseau Traefik resout keycloak.groupec.test dans Docker.
    user_docker run --rm --network GroupeC-applicatif         -v "$ROOT/traefik/certs/local.crt:/tmp/groupec-ca.crt:ro"         curlimages/curl:8.11.1 -fsS --connect-timeout 5 --max-time 15 --cacert /tmp/groupec-ca.crt         -o /dev/null         https://keycloak.groupec.test:4443/realms/groupec/.well-known/openid-configuration || {
        echo 'ERREUR: Keycloak OIDC inaccessible depuis le reseau applicatif' >&2; exit 1;
      }
    # Verifier le flux OIDC et la confidentialite : aucun port direct.
    kc_id="$(user_docker compose -f "$ROOT/keycloak/docker-compose.yml" ps -q keycloak)"
    [ -n "$kc_id" ] && [ -z "$(user_docker port "$kc_id")" ] || {
      echo 'ERREUR: exposition directe de Keycloak' >&2; exit 1;
    }
    user_docker inspect -f '{{json .NetworkSettings.Networks}}' "$kc_id" | grep -q GroupeC-donnees || {
      echo 'ERREUR: Keycloak absent du reseau donnees' >&2; exit 1;
    }
    # Resolution locale (VM seulement) : le DNS Docker des conteneurs n'est pas modifie.
    # URL et SNI restent keycloak.groupec.test; le certificat autosigne est controle.
    if ! grep -Eq '^127\.0\.0\.1[[:space:]]+keycloak\.groupec\.test([[:space:]]|$)' /etc/hosts; then
      printf '%s\n' '127.0.0.1 keycloak.groupec.test' >> /etc/hosts
    fi
    getent ahostsv4 keycloak.groupec.test | grep -q '^127\.0\.0\.1[[:space:]]' || {
      echo 'ERREUR: le domaine Keycloak ne resout pas vers 127.0.0.1 sur la VM' >&2; exit 1;
    }
    # Keycloak : administrateur permanent, verification effective des droits,
    # suppression bootstrap UNIQUEMENT apres re-authentification reussie;
    # etudiant-test (password genere et stocke sur la VM).
    python3 "$ROOT/keycloak/provision-users.py"
    # La base Moodle est deja creee et verifiee par la partie PostgreSQL.
    user_docker compose -f "$ROOT/moodle/docker-compose.yml" up -d
    # MOODLE: maximum 15 minutes au premier boot (installation SQL initiale).
    # Connexion limitee a 5 s et chaque requete a 15 s.
    moodle_ready=no
    moodle_deadline=$((SECONDS + 900))
    while (( SECONDS < moodle_deadline )); do
      code="$(curl --noproxy '*' --connect-timeout 5 --max-time 15 -L --max-redirs 5 -sS -o /dev/null -w '%{http_code}' \
        --cacert "$ROOT/traefik/certs/local.crt" \
        --resolve moodle.groupec.test:4443:127.0.0.1 \
        https://moodle.groupec.test:4443/login/index.php || true)"
      if [ "$code" = 200 ]; then moodle_ready=yes; break; fi
      sleep 5
    done
    [ "$moodle_ready" = yes ] || {
      echo 'ERREUR: timeout Moodle: login indisponible apres 900 secondes (inspecter docker logs)' >&2; exit 1;
    }
    moodle_id="$(user_docker compose -f "$ROOT/moodle/docker-compose.yml" ps -q moodle)"
    [ -n "$moodle_id" ] && [ -z "$(user_docker port "$moodle_id")" ] || {
      echo 'ERREUR: exposition directe de Moodle' >&2; exit 1;
    }
    [ "$(user_docker exec "$moodle_id" id -u)" != 0 ] || {
      echo 'ERREUR: Moodle n execute pas l utilisateur attendu non-root' >&2; exit 1;
    }
    user_docker inspect -f '{{json .HostConfig.SecurityOpt}}' "$moodle_id" | grep -q no-new-privileges || {
      echo 'ERREUR: durcissement Moodle absent' >&2; exit 1;
    }
    # V5.4: Moodle detecte et installe le plugin local avant le premier login
    # etudiant. Une nouvelle VM ne doit pas imposer un changement de mot de
    # passe Moodle a un utilisateur dont le mot de passe est gere par Keycloak.
    # Moodle 5.3 range ses plugins sous public/local (Moodle >= 5.1).
    # Echouer explicitement si le volume du plugin est monte au mauvais chemin.
    user_docker exec "$moodle_id" test -f /var/www/html/public/local/groupec_ssofix/version.php || {
      echo 'ERREUR V5.4: plugin SSO absent de public/local dans le conteneur Moodle' >&2; exit 1;
    }
    # Moodle 5.3 et certaines images de compatibilite ne rangent pas la CLI
    # au meme endroit. Rechercher le script disponible sans supposer le chemin.
    moodle_upgrade="$(user_docker exec "$moodle_id" sh -c 'for p in /var/www/html/public/admin/cli/upgrade.php /var/www/html/admin/cli/upgrade.php; do if test -f "$p"; then echo "$p"; break; fi; done')"
    [ -n "$moodle_upgrade" ] || { echo 'ERREUR V5.4: script upgrade.php introuvable dans Moodle' >&2; exit 1; }
    user_docker exec "$moodle_id" php "$moodle_upgrade" --non-interactive
    user_docker exec "$moodle_id" php -r '
    define("CLI_SCRIPT", true); require "/var/www/html/config.php";
    $installed = (int) get_config("local_groupec_ssofix", "version");
    if ($installed < 2026112600) { fwrite(STDERR, "ERREUR : plugin correctif SSO non installe\n"); exit(1); }
    echo "SUCCES: correctif SSO Moodle installe.\n";'
    # Regler les parametres de securite Moodle apres installation SQL.
    moodle_cfg="$(user_docker exec "$moodle_id" sh -c 'find /var/www/html -path "*/admin/cli/cfg.php" | head -1')"
    if [ -n "$moodle_cfg" ]; then
      for kv in forcelogin=1 cookiesecure=1 passwordpolicy=1 \
        lockoutthreshold=5 lockoutwindow=1800 lockoutduration=1800 \
        sessiontimeout=7200 webserviceprotocols=rest auth=email,oauth2; do
        user_docker exec "$moodle_id" php "$moodle_cfg" --name="${kv%%=*}" --set="${kv#*=}"
      done
      # Verifier que le plugin OAuth2 est active sans desactiver la methode email.
      user_docker exec "$moodle_id" php -r \
        'define("CLI_SCRIPT", true); require "/var/www/html/config.php"; $methods = array_map("trim", explode(",", $CFG->auth ?? "")); if (!in_array("email", $methods, true) || !in_array("oauth2", $methods, true)) { fwrite(STDERR, "ERREUR: auth=email,oauth2 non applique\n"); exit(1); } echo "SUCCES: methodes email et oauth2 activees\n";'
    else
      echo 'AVERTISSEMENT: cfg.php absent ; parametres Moodle a regler dans l admin' >&2
    fi
    # Definir les ports cURL autorises (80/443/4443) sans desactiver la protection
    # SSRF: retrait uniquement de l'IP Traefik Keycloak des CIDR prives bloques.
    # Cette IP est fixe via Compose et verifiee contre DNS depuis Moodle.
    traefik_id="$(user_docker compose -f "$ROOT/traefik/docker-compose.yml" ps -q traefik)"
    proxy_ip="$(user_docker inspect "$traefik_id" --format '{{(index .NetworkSettings.Networks "GroupeC-applicatif").IPAddress}}')"
    [ "$proxy_ip" = 172.28.240.10 ] || { echo 'ERREUR: IP interne Traefik inattendue' >&2; exit 1; }
    user_docker exec "$moodle_id" php /opt/groupec-configure-curl-oidc.php "$proxy_ip"
    # SSO automatique : secret lu via stdin, jamais publie dans le YAML ou les journaux.
    # Executer seulement une fois Moodle installe et Keycloak disponible.
    # La commande est idempotente : pas de doublon si on rejoue deploy.sh.
    user_docker exec -i "$moodle_id" php /opt/groupec-configure-sso.php \
      < "$ROOT/secrets/moodle_oidc_client_secret"

    echo 'SUCCES: Keycloak OIDC HTTP 200, Moodle HTTPS/login HTTP 200, sans ports hote directs.'
    echo 'SSO: fournisseur Moodle OAuth2 cree automatiquement; tester une connexion utilisateur reelle depuis le navigateur.'

    echo 'A VERIFIER: lecture reelle des json-file par Alloy et requetes Grafana -> Loki.'
    echo 'NOTE V5.4: Drupal et n8n seront demarres apres la preparation Moodle; parcours achat a tester au navigateur.'

    # Controle SSO sans pipeline curl | grep -q : sous pipefail, grep -q peut
    # fermer le tube avant la fin de curl (SIGPIPE), causant un faux echec.
    # Le contenu HTML entier est d'abord sauvegarde localement.
    if ! curl --noproxy '*' --connect-timeout 5 --max-time 30 -fsS \
        --cacert "$ROOT/traefik/certs/local.crt" \
        --resolve moodle.groupec.test:4443:127.0.0.1 \
        -o /tmp/groupec-moodle-login-v51.html \
        https://moodle.groupec.test:4443/login/index.php; then
      echo 'ERREUR V5.1: impossible de charger la page de connexion Moodle' >&2
      exit 1
    fi
    if ! grep -Fq 'Keycloak Groupe C' /tmp/groupec-moodle-login-v51.html; then
      echo 'ERREUR V5.1: bouton Keycloak absent de la page Moodle' >&2
      exit 1
    fi
    echo 'SUCCES: configuration SSO Moodle + Keycloak et bouton de connexion verifies automatiquement.'

    # ========================================================================
    # V5: Moodle API et catalogue (SSO de V3 INCHANGE)
    # ========================================================================
    user_docker exec "$moodle_id" php /opt/groupec-configure-moodle-v5.php
    # Quiz/pages facultatifs: ne bloquent pas l'API ni les applications.
    if ! user_docker exec "$moodle_id" php /opt/groupec-configure-moodle-content-v5.php; then
      echo 'AVERTISSEMENT V5: contenus pedagogiques facultatifs incomplets; voir logs Moodle.' >&2
    fi
    moodle_token="$(user_docker exec "$moodle_id" php /opt/groupec-configure-moodle-v5.php --token-only)"
    student_role="$(user_docker exec "$moodle_id" php /opt/groupec-configure-moodle-v5.php --role-only)"
    [[ "$moodle_token" =~ ^[0-9a-f]{32,128}$ ]] || { echo 'ERREUR: token API Moodle absent' >&2; exit 1; }
    [[ "$student_role" =~ ^[0-9]+$ ]] || { echo 'ERREUR: role etudiant Moodle absent' >&2; exit 1; }
    ( umask 077; printf '%s' "$moodle_token" > "$ROOT/secrets/n8n_moodle_token" )
    chown ubuntu:ubuntu "$ROOT/secrets/n8n_moodle_token"
    chmod 0600 "$ROOT/secrets/n8n_moodle_token"
    # Utiliser le certificat de labo et le meme domaine que le navigateur.
    # Les erreurs Moodle doivent etre inspectees: pas d'activation si l'API n'est pas prete.
    rest_result="$(curl --noproxy '*' -fsS --connect-timeout 5 --max-time 30 \
      --cacert "$ROOT/traefik/certs/local.crt" \
      --resolve moodle.groupec.test:4443:127.0.0.1 \
      -d "wstoken=$moodle_token" -d 'wsfunction=core_course_get_courses_by_field' \
      -d 'moodlewsrestformat=json' -d 'field=shortname' -d 'value=CYBER465' \
      https://moodle.groupec.test:4443/webservice/rest/server.php)"
    if ! printf '%s' "$rest_result" | jq -e '.courses | length > 0' >/dev/null; then
      echo 'ERREUR V5: API REST Moodle non operationnelle (cours CYBER465)' >&2; exit 1
    fi
    unset moodle_token rest_result

    # ========================================================================
    # V5: secrets et configuration locale de n8n
    # ========================================================================
    # n8n >= 2.17.0: l'owner peut etre cree depuis un hash bcrypt par variables d'env.
    owner_hash="$(htpasswd -nbBC 10 admin "$(cat "$ROOT/secrets/n8n_admin_password")" | sed -e 's/^[^:]*://' | tr -d '\r\n')"
    [[ "$owner_hash" == \$2* ]] || { echo 'ERREUR: bcrypt n8n invalide' >&2; exit 1; }
    ( umask 077
      printf "N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true\nN8N_INSTANCE_OWNER_EMAIL=admin@groupec.test\nN8N_INSTANCE_OWNER_FIRST_NAME=Admin\nN8N_INSTANCE_OWNER_LAST_NAME=GroupeC\nN8N_INSTANCE_OWNER_PASSWORD_HASH='%s'\n" "$owner_hash" > "$ROOT/n8n/.env"
      printf 'N8N_WEBHOOK_TOKEN=%s\nMOODLE_TOKEN=%s\nMOODLE_STUDENT_ROLE_ID=%s\n' \
        "$(cat "$ROOT/secrets/n8n_webhook_token")" \
        "$(cat "$ROOT/secrets/n8n_moodle_token")" \
        "$student_role" >> "$ROOT/n8n/.env"
    )
    chown ubuntu:ubuntu "$ROOT/n8n/.env"
    chmod 0600 "$ROOT/n8n/.env"
    unset owner_hash student_role

    # VERIFICATIONS avant execution: les ports de ces Compose ne doivent pas etre exposes.
    for service in drupal n8n; do
      user_docker compose -f "$ROOT/$service/docker-compose.yml" config --quiet
    done
    # n8n avant Drupal : le webhook doit etre disponible pour l'evenement de paiement.
    user_docker compose -f "$ROOT/n8n/docker-compose.yml" up -d
    n8n_ready=no
    for i in $(seq 1 120); do
      code="$(curl --noproxy '*' -sS -o /dev/null -w '%{http_code}' \
        --cacert "$ROOT/traefik/certs/local.crt" \
        --resolve n8n.groupec.test:4443:127.0.0.1 \
        https://n8n.groupec.test:4443/healthz || true)"
      if [ "$code" = 200 ]; then n8n_ready=yes; break; fi
      sleep 3
    done
    [ "$n8n_ready" = yes ] || { echo 'ERREUR: n8n indisponible /healthz' >&2; exit 1; }
    n8n_id="$(user_docker compose -f "$ROOT/n8n/docker-compose.yml" ps -q n8n)"
    [ -n "$n8n_id" ] && [ -z "$(user_docker port "$n8n_id")" ] || {
      echo 'ERREUR: n8n publie un port hote direct' >&2; exit 1;
    }
    # V5.5: le workflow contient le webhookId TOP-LEVEL et les deux IF corriges.
    # L'import CLI peut desactiver le workflow et la publication ne recharge pas
    # les routes du serveur n8n deja en cours d'execution.
    user_docker exec "$n8n_id" n8n import:workflow --input=/workflows/drupal-moodle.json
    user_docker exec "$n8n_id" n8n publish:workflow --id=GroupeCMoodle001
    user_docker compose -f "$ROOT/n8n/docker-compose.yml" restart n8n

    # Preuve AVANT Drupal: webhook PRODUCTION enregistre et verification token.
    # Un faux token doit etre refuse avec HTTP 403 (404 = webhook non actif).
    webhook_ready=no
    for i in $(seq 1 60); do
      code="$(user_docker exec "$n8n_id" node -e '
