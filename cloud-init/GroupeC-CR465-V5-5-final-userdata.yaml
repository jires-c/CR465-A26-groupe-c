    $tokenonly = in_array('--token-only', $argv ?? [], true);
    $roleonly = in_array('--role-only', $argv ?? [], true);
    if ($tokenonly || $roleonly) {
        if ($tokenonly) {
            $service = $DB->get_record('external_services', ['shortname' => 'n8n_moodle'], '*', MUST_EXIST);
