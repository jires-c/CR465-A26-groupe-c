        } else {
            $student = $DB->get_record('role', ['shortname' => 'student'], '*', MUST_EXIST);
            echo $student->id;
        }
        exit(0);
    }

    set_config('enablewebservices', 1);
    set_config('webserviceprotocols', 'rest');

    // Correspondance du catalogue du collegue: chaque SKU est un cours Moodle existant.
    $courses = [
        'CYBER465' => 'Introduction à la cybersécurité',
        'DOCKER101' => 'Docker Essentials',
        'LINUX201' => 'Administration Linux',
        'DRUPAL301' => 'Drupal 11 Avancé',
        'K8S101' => 'Kubernetes Fundamentals',
        'N8N101' => 'Automatisation avec n8n',
        'PGSQL201' => 'PostgreSQL Administration',
        'GIT101' => 'Git et GitLab',
        'SECLNX301' => 'Sécurité Linux',
        'ANSIBLE101' => 'Ansible Débutant',
        'CLOUD101' => 'Cloud Init et Multipass',
    ];
    $manual = enrol_get_plugin('manual');
    if (!$manual) {
        throw new RuntimeException('Plugin enrolment manual absent');
    }
    foreach ($courses as $shortname => $fullname) {
        $course = $DB->get_record('course', ['shortname' => $shortname]);
        if (!$course) {
            $data = (object)[
                'fullname' => $fullname,
                'shortname' => $shortname,
                'category' => 1,
                'format' => 'topics',
                'numsections' => 3,
                'visible' => 1,
                'summary' => 'Formation Groupe C accessible après achat simulé.',
                'summaryformat' => FORMAT_HTML,
            ];
            $course = create_course($data);
        }
        $instances = enrol_get_instances($course->id, false);
        $hasmanual = false;
        foreach ($instances as $instance) {
            if ($instance->enrol === 'manual') {
                $hasmanual = true;
                break;
            }
        }
        if (!$hasmanual) {
            $manual->add_instance($course, ['status' => ENROL_INSTANCE_ENABLED]);
        }
    }

    $serviceuser = $DB->get_record('user', ['username' => 'n8n-service', 'deleted' => 0]);
    if (!$serviceuser) {
        $u = (object)[
            'username' => 'n8n-service',
            'firstname' => 'n8n',
            'lastname' => 'Service',
            'email' => 'n8n-service@groupec.test',
            'auth' => 'manual',
            'confirmed' => 1,
            'mnethostid' => $CFG->mnet_localhost_id,
            'password' => bin2hex(random_bytes(32)) . 'Aa1!',
        ];
        $id = user_create_user($u);
        $serviceuser = $DB->get_record('user', ['id' => $id], '*', MUST_EXIST);
    }
    $system = context_system::instance();
    $role = $DB->get_record('role', ['shortname' => 'n8n_api']);
    if (!$role) {
        $roleid = create_role('n8n API Integration', 'n8n_api', 'Inscription aux cours du laboratoire');
    } else {
        $roleid = $role->id;
    }
    set_role_contextlevels($roleid, [CONTEXT_SYSTEM, CONTEXT_COURSE]);
    role_assign($roleid, $serviceuser->id, $system->id);
    foreach (['webservice/rest:use', 'moodle/user:viewdetails', 'moodle/course:useremail',
              'moodle/course:view', 'enrol/manual:enrol', 'moodle/role:assign'] as $cap) {
        assign_capability($cap, CAP_ALLOW, $roleid, $system->id, true);
    }

    // V5.5: CORRECTIF VALIDE sur VM. Sans ce droit, l'API REST
    // core_user_get_users_by_field(field=email) peut renvoyer [] meme si
    // l'utilisateur OAuth2 existe dans Moodle. Role limite a n8n-service.
    set_config('showuseridentity', 'email');
    $identityrole = $DB->get_record('role', ['shortname' => 'groupec_n8n_identity']);
    if (!$identityrole) {
        $identityroleid = create_role('Groupe C - Identite API n8n', 'groupec_n8n_identity',
            'Lecture des identites des utilisateurs pour la recherche REST n8n');
    } else {
        $identityroleid = (int) $identityrole->id;
    }
    set_role_contextlevels($identityroleid, [CONTEXT_SYSTEM]);
    assign_capability('moodle/site:viewuseridentity', CAP_ALLOW, $identityroleid, $system->id, true);
    role_assign($identityroleid, $serviceuser->id, $system->id);
    reload_all_capabilities();
    if (!has_capability('moodle/site:viewuseridentity', $system, $serviceuser->id)) {
        throw new RuntimeException('Le compte API n8n ne peut pas rechercher les utilisateurs par courriel');
    }

    $student = $DB->get_record('role', ['shortname' => 'student'], '*', MUST_EXIST);
    if (!$DB->record_exists('role_allow_assign', ['roleid' => $roleid, 'allowassign' => $student->id])) {
        $DB->insert_record('role_allow_assign', ['roleid' => $roleid, 'allowassign' => $student->id]);
    }

    $service = $DB->get_record('external_services', ['shortname' => 'n8n_moodle']);
    if (!$service) {
        $s = (object)[
            'name' => 'n8n Moodle Integration', 'shortname' => 'n8n_moodle',
            'enabled' => 1, 'restrictedusers' => 1, 'downloadfiles' => 0,
            'uploadfiles' => 0, 'timecreated' => time(),
        ];
        $s->id = $DB->insert_record('external_services', $s);
        $service = $s;
    }
    // Aucun droit de creation de cours via API: les 11 cours pre-crees sont la liste autorisee.
    foreach (['core_user_get_users_by_field', 'core_course_get_courses_by_field',
              'enrol_manual_enrol_users'] as $func) {
        if (!$DB->record_exists('external_services_functions', [
            'externalserviceid' => $service->id, 'functionname' => $func])) {
            $DB->insert_record('external_services_functions', [
                'externalserviceid' => $service->id, 'functionname' => $func]);
        }
    }
    if (!$DB->record_exists('external_services_users', [
        'externalserviceid' => $service->id, 'userid' => $serviceuser->id])) {
        $DB->insert_record('external_services_users', [
            'externalserviceid' => $service->id,
            'userid' => $serviceuser->id,
            'timecreated' => time(),
        ]);
    }
    if (!$DB->record_exists('external_tokens', [
        'userid' => $serviceuser->id, 'externalserviceid' => $service->id, 'tokentype' => 0])) {
        $DB->insert_record('external_tokens', (object)[
            'token' => bin2hex(random_bytes(32)),
            'tokentype' => 0,
            'userid' => $serviceuser->id,
            'externalserviceid' => $service->id,
            'contextid' => $system->id,
            'creatorid' => get_admin()->id,
            'timecreated' => time(),
            'validuntil' => 0,
            'iprestriction' => '',
        ]);
    }
    // V5.4: en cas de redeploiement, corriger aussi un etudiant SSO deja cree.
    // La premiere connexion sur une VM neuve est geree par local_groupec_ssofix.
    $demo = $DB->get_record('user', ['email' => 'etudiant-test@groupec.test', 'deleted' => 0]);
    if ($demo && $demo->auth === 'oauth2') {
        unset_user_preference('auth_forcepasswordchange', $demo->id);
    }
    echo 'SUCCES V5.4: catalogue de 11 cours, API REST et compte de service n8n.' . PHP_EOL;
- path: /opt/GroupeC/moodle/configure-moodle-content-v5.php
  owner: root:root
  permissions: !!str "0644"
  content: |
    <?php
    // Complement facultatif inspire de V4 : sections, pages et quiz d introduction.
    define('CLI_SCRIPT', true);
    require '/var/www/html/config.php';
    require_once($CFG->dirroot . '/course/lib.php');
    \core\session\manager::set_user(get_admin());
    $course = $DB->get_record('course', ['shortname' => 'CYBER465'], '*', MUST_EXIST);
    // Creation des sections du cours.
    course_create_sections_if_missing($course, [1, 2, 3]);

    $sections = [
        1 => 'Introduction a la cybersecurite',
        2 => 'Menaces et bonnes pratiques',
        3 => 'Evaluation des connaissances'
    ];

    foreach ($sections as $number => $name) {
        $section = $DB->get_record('course_sections', [
            'course' => $course->id,
            'section' => $number
        ], '*', MUST_EXIST);

        course_update_section($course, $section, [
            'name' => $name
        ]);
    }

    echo "Sections du cours configurees.\n";

    // Creation des pages de formation.
    require_once($CFG->dirroot . '/course/modlib.php');

    $pages = [
        [
            'section' => 1,
            'name' => 'Les fondamentaux de la cybersecurite',
            'content' => '<p>La cybersecurite repose sur trois principes : confidentialite, integrite et disponibilite.</p>'
        ],
        [
            'section' => 2,
            'name' => 'Menaces et bonnes pratiques',
            'content' => '<p>Les principales menaces sont le phishing, les logiciels malveillants et les rancongiciels. Utilisez des mots de passe robustes, le MFA et les mises a jour regulieres.</p>'
        ]
    ];

    foreach ($pages as $page) {
        if (!$DB->record_exists('page', [
            'course' => $course->id,
            'name' => $page['name']
        ])) {
            $module = new stdClass();
            $module->modulename = 'page';
            $module->module = $DB->get_field('modules', 'id', [
                'name' => 'page'
            ]);
            $module->course = $course->id;
            $module->section = $page['section'];
            $module->name = $page['name'];
            $module->intro = '';
            $module->introformat = FORMAT_HTML;
            $module->content = $page['content'];
            $module->contentformat = FORMAT_HTML;
            $module->visible = 1;
            $module->display = 5;

            add_moduleinfo($module, $course);
        }
    }

    echo "Pages de formation configurees.\n";

    // Creation du quiz.
    $quizname = 'Evaluation des connaissances';

    $quiz = $DB->get_record('quiz', [
        'course' => $course->id,
        'name' => $quizname
    ]);

    if (!$quiz) {
        $module = new stdClass();
        $module->modulename = 'quiz';
        $module->module = $DB->get_field('modules', 'id', [
            'name' => 'quiz'
        ]);
        $module->course = $course->id;
        $module->section = 3;
        $module->name = $quizname;
        $module->intro = 'Testez vos connaissances en cybersecurite.';
        $module->introformat = FORMAT_HTML;
        $module->visible = 1;
        $module->timelimit = 600;
        $module->quizpassword = '';
        $module->attempts = 2;
        $module->grade = 10;
        $module->gradepass = 6;
        $module->grademethod = 1;
        $module->preferredbehaviour = 'deferredfeedback';

        add_moduleinfo($module, $course);
    }

    echo "Quiz Moodle configure.\n";

    // Questions et reponses du quiz.
    $questions = [
        [
            'question' => 'Quels sont les trois piliers de la cybersecurite ?',
            'answers' => [
                'Confidentialite, integrite et disponibilite',
                'Authentification, rapidite et stockage',
                'Internet, reseau et serveur'
            ]
        ],
        [
            'question' => 'Quel est le but du phishing ?',
            'answers' => [
                'Voler des informations sensibles',
                'Ameliorer la securite',
                'Mettre a jour un logiciel'
            ]
        ],
        [
            'question' => 'Que signifie MFA ?',
            'answers' => [
                'Authentification multifacteur',
                'Module de filtrage automatique',
                'Methode de fichier avancee'
            ]
        ],
        [
            'question' => 'Quelle pratique ameliore la securite ?',
            'answers' => [
                'Effectuer regulierement les mises a jour',
                'Partager ses mots de passe',
                'Desactiver les protections'
            ]
        ],
        [
            'question' => 'Quel est le but d un rancongiciel ?',
            'answers' => [
                'Bloquer les donnees et exiger une rancon',
                'Accelerer un ordinateur',
                'Proteger les fichiers'
            ]
        ]
    ];      
    // Enregistrement des questions dans le quiz.
    require_once($CFG->dirroot . '/lib/questionlib.php');
    require_once($CFG->dirroot . '/mod/quiz/locallib.php');

    $quiz = $DB->get_record('quiz', [
        'course' => $course->id,
        'name' => $quizname
    ], '*', MUST_EXIST);

    $cm = get_coursemodule_from_instance(
        'quiz', $quiz->id, $course->id, false, MUST_EXIST
    );

    $quizcontext = context_module::instance($cm->id);
    $category = question_get_default_category($quizcontext->id, true);

    foreach ($questions as $index => $item) {
        $name = 'CYBER465-Q' . ($index + 1);

        $questionid = $DB->get_field_sql(
            "SELECT q.id
               FROM {question} q
               JOIN {question_versions} qv ON qv.questionid = q.id
               JOIN {question_bank_entries} qbe
                 ON qbe.id = qv.questionbankentryid
              WHERE qbe.questioncategoryid = :category
                AND q.name = :name
           ORDER BY qv.version DESC",
            ['category' => $category->id, 'name' => $name],
            IGNORE_MULTIPLE
        );

        if (!$questionid) {
            $question = new stdClass();
            $question->qtype = 'multichoice';

            $form = new stdClass();
            $form->category = (string)$category->id;
            $form->name = $name;
            $form->questiontext = [
                'text' => $item['question'],
                'format' => FORMAT_HTML
            ];
            $form->generalfeedback = [
                'text' => '',
                'format' => FORMAT_HTML
            ];
            $form->defaultmark = 2;
            $form->penalty = 0;
            $form->single = 1;
            $form->shuffleanswers = 1;
            $form->answernumbering = 'abc';
            $form->status = 'ready';

            foreach ($item['answers'] as $i => $answer) {
                $form->answer[$i] = [
                    'text' => $answer,
                    'format' => FORMAT_HTML
                ];
                $form->fraction[$i] = ($i === 0) ? 1 : 0;
                $form->feedback[$i] = [
                    'text' => '',
                    'format' => FORMAT_HTML
                ];
            }

            foreach (['correctfeedback',
                      'partiallycorrectfeedback',
                      'incorrectfeedback'] as $field) {
                $form->$field = [
                    'text' => '',
                    'format' => FORMAT_HTML
                ];
            }

            $saved = question_bank::get_qtype('multichoice')
                ->save_question($question, $form);

            $questionid = $saved->id;
        }

        quiz_add_quiz_question($questionid, $quiz, 0, 2);
    }

    echo "Questions du quiz configurees.\n";
    // Recalcul du total des points du quiz.
    \mod_quiz\quiz_settings::create($quiz->id)
        ->get_grade_calculator()
        ->recompute_quiz_sumgrades();

    echo "Total des points du quiz recalcule.\n";
- path: /opt/GroupeC/drupal/Dockerfile
  owner: root:root
  permissions: !!str "0644"
  content: |
    FROM php:8.3-apache
    RUN apt-get update && apt-get install -y --no-install-recommends \
        git unzip curl postgresql-client libpq-dev libzip-dev libicu-dev \
        libpng-dev libjpeg62-turbo-dev libfreetype6-dev \
     && docker-php-ext-configure gd --with-freetype --with-jpeg \
     && docker-php-ext-install -j"$(nproc)" gd intl pdo_pgsql zip bcmath \
     && a2enmod rewrite headers \
     && rm -rf /var/lib/apt/lists/*
    COPY --from=composer:2 /usr/bin/composer /usr/local/bin/composer
    WORKDIR /opt/drupal
    RUN composer create-project 'drupal/recommended-project:^11' . --no-interaction --no-progress \
     && composer require 'drush/drush:^13' 'drupal/commerce:^3' -W --no-interaction --no-progress
    ENV APACHE_DOCUMENT_ROOT=/opt/drupal/web
    RUN sed -ri -e 's!/var/www/html!/opt/drupal/web!g' \
        /etc/apache2/sites-available/*.conf /etc/apache2/apache2.conf /etc/apache2/conf-available/*.conf \
     && printf '\n<Directory /opt/drupal/web>\nOptions FollowSymLinks\nAllowOverride All\nRequire all granted\n</Directory>\n' >> /etc/apache2/apache2.conf \
     && echo 'ServerName drupal' >> /etc/apache2/apache2.conf
    COPY scripts/init-drupal.sh /usr/local/bin/init-drupal.sh
    COPY scripts/init-content.php /usr/local/bin/init-content.php
    COPY modules/groupec_n8n/ /opt/drupal/web/modules/custom/groupec_n8n/
    RUN chmod 0755 /usr/local/bin/init-drupal.sh
    ENTRYPOINT ["/usr/local/bin/init-drupal.sh"]
- path: /opt/GroupeC/drupal/scripts/init-drupal.sh
  owner: root:root
  permissions: !!str "0755"
  content: |
    #!/usr/bin/env bash
    set -euo pipefail
    DBPASS="$(tr -d '\r\n' < "$DRUPAL_DB_PASSWORD_FILE")"
    ADMINPASS="$(tr -d '\r\n' < "$DRUPAL_ADMIN_PASSWORD_FILE")"
    export PGPASSWORD="$DBPASS"
    until pg_isready -h "$DRUPAL_DB_HOST" -p "$DRUPAL_DB_PORT" -U "$DRUPAL_DB_USER" >/dev/null 2>&1; do
      echo 'En attente de PostgreSQL pour Drupal...'; sleep 3
    done
    cd /opt/drupal
    DRUSH=./vendor/bin/drush
    # Une installation n'a lieu que si les tables Drupal ne sont pas presentes.
    installed="$(psql -h "$DRUPAL_DB_HOST" -U "$DRUPAL_DB_USER" -d "$DRUPAL_DB_NAME" -Atc "SELECT to_regclass('public.config');" || true)"
    if [ "$installed" != config ]; then
      mkdir -p web/sites/default/files
      cp -n web/sites/default/default.settings.php web/sites/default/settings.php || true
      chmod u+w web/sites/default/settings.php || true
      "$DRUSH" site:install standard -y \
        --db-url="pgsql://${DRUPAL_DB_USER}:${DBPASS}@${DRUPAL_DB_HOST}:${DRUPAL_DB_PORT}/${DRUPAL_DB_NAME}" \
        --account-name=admin --account-pass="$ADMINPASS" --site-name='Groupe C'
    fi
    if ! grep -q 'GROUPEC V5 TRUSTED HOSTS' web/sites/default/settings.php; then
      cat >> web/sites/default/settings.php <<'PHP'
    // GROUPEC V5 TRUSTED HOSTS: web publie exclusivement via Traefik.
    $settings['trusted_host_patterns'] = ['^drupal\\.groupec\\.test$', '^drupal\\.localhost$'];
    PHP
    fi
    # V5.5: correctif VALIDE sur la VM: le reverse proxy doit transmettre
    # le scheme HTTPS et le Host original pour les redirects Commerce.
    # L'IP 172.28.240.10 est celle de Traefik sur GroupeC-applicatif.
    if ! grep -q 'GROUPEC V5.5 REVERSE PROXY' web/sites/default/settings.php; then
      cat >> web/sites/default/settings.php <<'PHP'
    // GROUPEC V5.5 REVERSE PROXY: Traefik est l'unique proxy de confiance.
    $settings['reverse_proxy'] = TRUE;
    $settings['reverse_proxy_addresses'] = ['172.28.240.10'];
    $settings['reverse_proxy_trusted_headers'] =
      \Symfony\Component\HttpFoundation\Request::HEADER_X_FORWARDED_FOR |
      \Symfony\Component\HttpFoundation\Request::HEADER_X_FORWARDED_HOST |
      \Symfony\Component\HttpFoundation\Request::HEADER_X_FORWARDED_PROTO;
    PHP
    fi
    chown -R www-data:www-data web/sites/default
    chmod 0440 web/sites/default/settings.php
    "$DRUSH" en -y views views_ui commerce commerce_store commerce_product commerce_order \
      commerce_cart commerce_checkout commerce_price commerce_payment groupec_n8n
    "$DRUSH" updb -y
    "$DRUSH" cr
    "$DRUSH" php:script /usr/local/bin/init-content.php
    "$DRUSH" cr
    printf '%s\n' 'SUCCES Drupal Commerce : installation, module n8n et catalogue initialises.'
    exec apache2-foreground
- path: /opt/GroupeC/drupal/scripts/init-content.php
  owner: root:root
  permissions: !!str "0644"
  content: |
    <?php
    /**
     * Catalogue de formations GroupeC avec Drupal Commerce.
     * - crée chaque formation comme produit Commerce (avec prix)
     * - crée la page /formations qui liste les formations avec prix + "Ajouter au panier"
     * - crée un moyen de paiement simulé (aucun paiement réel)
     * - donne aux visiteurs le droit de voir, mettre au panier et commander
     *
     * Utilise le magasin par défaut s'il existe, sinon en crée un (GroupeC, CAD).
     * Idempotent : peut être relancé sans créer de doublons.
     */

    use Drupal\commerce_payment\Entity\PaymentGateway;
    use Drupal\commerce_price\Price;
    use Drupal\commerce_product\Entity\Product;
    use Drupal\commerce_product\Entity\ProductVariation;
    use Drupal\commerce_store\Entity\Store;
    use Drupal\views\Entity\View;

    #############################################
    # 0. Magasin par défaut
    #############################################

    $storeStorage = \Drupal::entityTypeManager()->getStorage('commerce_store');
    $store = $storeStorage->loadDefault();
    if (!$store) {
        // Pas de magasin : on en crée un de démonstration (devise CAD).
        \Drupal::service('commerce_price.currency_importer')->import('CAD');
        $store = Store::create([
            'type' => 'online',
            'uid' => 1,
            'name' => 'GroupeC',
            'mail' => 'admin@groupec.local',
            'default_currency' => 'CAD',
            'timezone' => 'America/Toronto',
            'address' => [
                'country_code' => 'CA',
                'administrative_area' => 'ON',
                'locality' => 'Toronto',
                'postal_code' => 'M5V 2T6',
                'address_line1' => '1 rue de la Démo',
                'organization' => 'GroupeC',
            ],
            'billing_countries' => ['CA'],
        ]);
        $store->setDefault(TRUE);
        $store->save();
        echo "Magasin de démonstration créé\n";
    }
    $devise = $store->getDefaultCurrencyCode();
    echo "Magasin : " . $store->label() . " ($devise)\n";

    #############################################
    # 1. Formations = produits Commerce
    #############################################

    // SKU => [titre, prix]. Prix de démonstration : ajustez-les librement.
    $formations = [
        'CYBER465'  => ['CYBER465', '600'],
        'DOCKER101' => ['Docker Essentials', '450'],
        'LINUX201'  => ['Administration Linux', '500'],
        'DRUPAL301' => ['Drupal 11 Avancé', '650'],
        'K8S101'    => ['Kubernetes Fundamentals', '700'],
        'N8N101'    => ['Automatisation avec n8n', '400'],
        'PGSQL201'  => ['PostgreSQL Administration', '550'],
        'GIT101'    => ['Git et GitLab', '350'],
        'SECLNX301' => ['Sécurité Linux', '600'],
        'ANSIBLE101'=> ['Ansible Débutant', '450'],
        'CLOUD101'  => ['Cloud Init et Multipass', '300'],
    ];

    $varStorage = \Drupal::entityTypeManager()->getStorage('commerce_product_variation');

    foreach ($formations as $sku => [$titre, $prix]) {
        $prixObj = new Price($prix, $devise);

        $variation = $varStorage->loadBySku($sku);
        if ($variation) {
            // Mettre à jour le prix si besoin.
            if (!$variation->getPrice() || !$variation->getPrice()->equals($prixObj)) {
                $variation->setPrice($prixObj);
                $variation->save();
                echo "Prix mis à jour : $titre -> $prix $devise\n";
            }
            continue;
        }

        $variation = ProductVariation::create([
            'type' => 'default',
            'sku' => $sku,
            'title' => $titre,
            'price' => $prixObj,
            'status' => 1,
        ]);
        $variation->save();

        Product::create([
            'type' => 'default',
            'title' => $titre,
            'uid' => 1,
            'stores' => [$store->id()],
            'variations' => [$variation],
            'body' => [
                'value' => '<p>Formation : ' . $titre . '</p>',
                'format' => 'basic_html',
            ],
            'status' => 1,
        ])->save();

        echo "Formation créée : $titre ($prix $devise)\n";
    }

    // Afficher le prix sur la fiche produit (injecté depuis la variation).
    \Drupal::service('entity_display.repository')
        ->getViewDisplay('commerce_product_variation', 'default')
        ->setComponent('price', ['label' => 'inline', 'type' => 'commerce_price_default'])
        ->save();

    // Le chemin /formations est fourni par groupec_n8n.routing.yml.

    #############################################
    # 3. Paiement simulé
    #############################################

    if (!PaymentGateway::load('paiement_simule')) {
        PaymentGateway::create([
            'id' => 'paiement_simule',
            'label' => 'Paiement simulé',
            'plugin' => 'manual',
            'status' => TRUE,
            'weight' => 0,
            'configuration' => [
                'display_label' => 'Paiement simulé (aucun débit réel)',
                'mode' => 'n/a',
                'collect_billing_information' => FALSE,
                'instructions' => [
                    'value' => 'Ceci est une simulation : aucun paiement réel ne sera effectué.',
                    'format' => 'plain_text',
                ],
            ],
        ])->save();
        echo "Moyen de paiement simulé créé\n";
    }

    #############################################
    # 4. Droits des visiteurs
    #############################################

    $droits = ['view commerce_product', 'access checkout'];
    foreach (['anonymous', 'authenticated'] as $role) {
        user_role_grant_permissions($role, $droits);
    }
    echo "Droits accordés : " . implode(', ', $droits) . "\n";
          #############################################
    # 5. Page d'accueil = catalogue
    #############################################

    \Drupal::configFactory()
        ->getEditable('system.site')
        ->set('page.front', '/formations')
        ->save();
    echo "Page d'accueil : /formations\n";

    echo "Catalogue Commerce prêt : /formations\n";
