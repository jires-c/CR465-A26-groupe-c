runcmd:
#================================================
#docker rootless
#==============================================


#================================================
#Demarrage des containers
#==================================================
  

  - docker compose -f /opt/postgres/docker-compose.yml up -d

  - sleep 30

  - docker compose -f /opt/keycloak/docker-compose.yml up -d

  - docker compose -f /opt/moodle/docker-compose.yml up -d

  - docker compose -f /opt/n8n/docker-compose.yml up -d

  - docker compose -f /opt/grafana/docker-compose.yml up -d
  - docker compose -f /opt/portainer/docker-compose.yml up -d

  - /opt/portainer/init-portainer.sh