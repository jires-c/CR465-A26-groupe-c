#==========================================================
# Preparations des fichier pour installer docker rootless
#==========================================================
write_files:
  - path: /usr/local/sbin/prepare-docker-rootless.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      cat > /etc/apt/sources.list.d/docker.sources <<SOURCES
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: noble
      Components: stable
      Architectures: $(dpkg --print-architecture)
      Signed-By: /etc/apt/keyrings/docker.asc
      SOURCES
      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin docker-ce-rootless-extras    
      systemctl disable --now docker.service docker.socket
      rm -f /run/docker.sock
      ufw allow 22/tcp
      ufw --force enable     


  - path: /usr/local/sbin/activate-docker-rootless.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail      
      DOCKER_USER=ubuntu      
      USER_ID="$(id -u "$DOCKER_USER")"      
      RUNTIME_DIR="/run/user/${USER_ID}"      
      BUS_ADDRESS="unix:path=${RUNTIME_DIR}/bus"      
      for file in /etc/subuid /etc/subgid; do        
        if ! awk -F: '$1 == "ubuntu" && $3 >= 65536 {ok=1} END{exit !ok}' "$file"; then
          echo "ERREUR: plage UID/GID insuffisante dans $file" >&2
          exit 1
        fi
      done

      loginctl enable-linger "$DOCKER_USER"      
      systemctl start "user@${USER_ID}.service"      
      for i in $(seq 1 30); do
        [ -S "${RUNTIME_DIR}/bus" ] && break
        sleep 1
      done
      
      [ -S "${RUNTIME_DIR}/bus" ] || { echo 'ERREUR: bus systemd absent' >&2; exit 1; }

      
      user_cmd() {
        runuser -u "$DOCKER_USER" -- env \
          HOME="/home/${DOCKER_USER}" USER="$DOCKER_USER" LOGNAME="$DOCKER_USER" \
          XDG_RUNTIME_DIR="$RUNTIME_DIR" \
          DBUS_SESSION_BUS_ADDRESS="$BUS_ADDRESS" \
          PATH="/usr/local/bin:/usr/bin:/bin" "$@"
      }

      
      user_cmd dockerd-rootless-setuptool.sh install      
      user_cmd systemctl --user enable --now docker.service      
      user_cmd docker context use rootless      
      verified=no      
      for i in $(seq 1 30); do       
        if user_cmd docker info --format '{{json .SecurityOptions}}' 2>/dev/null | grep -q rootless; then
          verified=yes
          break
        fi
        sleep 2
      done      
      [ "$verified" = yes ] || { echo 'ERREUR: Docker Rootless non operationnel' >&2; exit 1; }
      echo 'SUCCES: Docker Rootless installe et actif sous ubuntu'      
      user_cmd docker info --format '{{json .SecurityOptions}}'

      

#==============================================
#creation des docker composes
#================================================
  - path:  /opt/GroupeC/traefik/dynamic/tls.yaml
    owner: root:root
    permissions: "0777"
    content: |

      tls:
        certificates:
          - certFile: /certs/local.crt
            keyFile:  /certs/local.key

#traefik
  - path: /opt/GroupeC/traefik/docker-compose.yml
    owner: root:root
    permissions: "0777"
    content: |
      
      services:

        cert-generator:
          image: alpine:latest
          container_name: cert-generator
          volumes:
            - ./certs:/certs
          entrypoint: /bin/sh
          command:
            - -c
            - |
              apk add --no-cache openssl
              
                            
              if [ ! -f /certs/local.crt ] || [ ! -f /certs/local.key ]; then
                openssl req -x509 -nodes -days 365 \
                  -newkey rsa:2048 \
                  -keyout /certs/local.key \
                  -out /certs/local.crt \
                  -subj "/CN=dashboard.docker.localhost" \
                  -addext "subjectAltName=DNS:localhost,DNS:*.localhost,DNS:*.local,IP:127.0.0.1"
                chmod 600 /certs/local.key
                chmod 644 /certs/local.crt
              fi

          restart: "no"

       
      
            
      
        traefik:
          image: traefik:v3.7
          depends_on:
            cert-generator:
              condition: service_completed_successfully
          container_name: traefik
          restart: unless-stopped

          security_opt:
            - no-new-privileges:true

          ports:
            - "8080:8080"
            - "8081:80"
            - "4443:443"

          volumes:
            # Docker Rootless socket
            - /run/user/1000/docker.sock:/var/run/docker.sock

            # Certificates
            - ./certs:/certs:ro

            # Dynamic configuration
            - ./dynamic:/dynamic:ro

          command:

            - "--entrypoints.web.address=:80"
            - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
            - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
            - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
            - "--entrypoints.websecure.address=:443"
            - "--entrypoints.websecure.http.tls=true"

            # File provider
            - "--providers.file.filename=/dynamic/tls.yaml"
            - "--providers.file.watch=true"

            # Docker provider
            - "--providers.docker=true"
            - "--providers.docker.endpoint=unix:///var/run/docker.sock"
            - "--providers.docker.exposedbydefault=false"
            - "--providers.docker.network=GroupeC-exposition"

            # API & Dashboard
            - "--api=true"
            - "--api.dashboard=true"
            - "--api.insecure=true"

            # Logs and metrics
            - "--log.level=INFO"
            - "--accesslog=true"
            - "--metrics.prometheus=true"

          labels:
            # Enable Traefik
            - "traefik.enable=true"

            # Dashboard router
            - "traefik.http.routers.dashboard.rule=HostRegexp(`{catchall:.*}`)"
            - "traefik.http.routers.dashboard.entrypoints=websecure"
            - "traefik.http.routers.dashboard.service=api@internal"
            - "traefik.http.routers.dashboard.tls=true"

            # Basic Authentication
            #- "traefik.http.middlewares.dashboard-auth.basicauth.users=REPLACE_WITH_HASH"
            #- "traefik.http.routers.dashboard.middlewares=dashboard-auth@docker"

          networks:
            - exposition
            - applicatif

      # Shared Docker networks
      networks:
        exposition:
          name: GroupeC-exposition

        applicatif:
          name: GroupeC-applicatif
          

