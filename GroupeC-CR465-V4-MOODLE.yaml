    et /opt/GroupeC/n8n/. Ne pas publier leurs ports sur l'hote : ajouter leurs
    routes HTTPS Traefik avec hostnames differents. Pour n8n, proteger la console,
    utiliser N8N_ENCRYPTION_KEY persistante, proteger webhooks/API et credentials.
    Pour Drupal, initialiser l'application et Commerce en paiement fictif; ne pas
    reutiliser le meme schema SQL ni les secrets de Moodle/Keycloak. Synchroniser
    les utilisateurs/inscriptions via des API securisees, pas par SQL direct.
    OPencast/Redis/OpenAppSec: encore a l'etat de gabarits / bonus.

    SECURITE / CONTROLE DU PERIMETRE
    Ne pas exposer PostgreSQL (5432), Redis (6379), Loki (3100), Keycloak HTTP 8080,
    Moodle HTTP 8080, Grafana HTTP 3000 et Portainer HTTP 9000.
    UFW ouvre 4443 pour le laboratoire mais l'acces depuis WINDOWS est confine a
    127.0.0.1 par VirtualBox NAT. Revoir UFW si migration vers un reseau bridge.
    Une machine neuve peut echouer si le sous-reseau 172.28.240.0/24 chevauche un
    VPN ou un reseau existant : choisir alors un CIDR libre + mise a jour compose,
    verification et regle SSL avant redeploiement.

    ATTENTION : NE PAS lancer ce cloud-init sur la VM EXISTANTE.
    Une nouvelle VM vide est necessaire pour valider le 100% automatisation.
    La presence de 9 services dans docker ps ne prouve pas la connexion navigateur.
runcmd:
  # 1) Preparation SSH / Docker Engine / pare-feu / desactivation docker rootful.
- [bash, /usr/local/sbin/prepare-docker-rootless.sh]
  # 2) Docker Rootless comme service systemd --user avec linger et controle.
- [bash, /usr/local/sbin/activate-docker-rootless.sh]
  # 3) Secrets, certificats, 4 reseaux, base et observabilite Loki/Alloy/Grafana.
- [bash, /opt/GroupeC/deploy.sh]

final_message: 'CR465 GroupeC : deploiement automatise fini ; controler 9 conteneurs, SSO, utilisateurs Keycloak, Grafana/Loki et acces navigateur.'
