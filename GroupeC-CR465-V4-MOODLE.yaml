        name: GroupeC-observabilite
  # ------------------------------------------------------------------------
  # LOKI : configuration TSDB, retention 7 jours
  # ------------------------------------------------------------------------
- path: /opt/GroupeC/observabilite/loki/loki-config.yaml
  owner: root:root
  permissions: !!str "0644"
  content: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 168h
      allow_structured_metadata: true

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem

  # ------------------------------------------------------------------------
  # ALLOY 1.10.2 : lecture des journaux Docker Rootless
  # ------------------------------------------------------------------------
- path: /opt/GroupeC/observabilite/alloy/docker-compose.yml
  owner: root:root
  permissions: !!str "0644"
  content: |
    name: groupec-alloy

    services:
      alloy:
        image: grafana/alloy:v1.10.2
        container_name: groupec-alloy
        # UID 0 ici = utilisateur ubuntu de l'hote via Docker Rootless (PAS root de l'hote).
        # Ce choix permet la lecture des journaux rootless en 0640; pas de mode privileged.
        user: "0:0"
        restart: unless-stopped
        security_opt:
          - no-new-privileges:true
        logging:
          driver: "json-file"
          options:
            max-size: "10m"
            max-file: "3"

        command:
          - run
          - /etc/alloy/config.alloy
          - --storage.path=/var/lib/alloy/data

        volumes:
          - ./config.alloy:/etc/alloy/config.alloy:ro
          - /home/ubuntu/.local/share/docker/containers:/journaux:ro
          - alloy_data:/var/lib/alloy/data

        networks:
          - observabilite

        mem_limit: 512m

    volumes:
      alloy_data:

    networks:
      observabilite:
        external: true
        name: GroupeC-observabilite
  # ------------------------------------------------------------------------
  # ALLOY : pipeline json-file vers Loki
  # ------------------------------------------------------------------------
- path: /opt/GroupeC/observabilite/alloy/config.alloy
  owner: root:root
  permissions: !!str "0644"
  content: |
    local.file_match "docker_logs" {
      path_targets = [
        {
          __path__ = "/journaux/*/*-json.log",
          job      = "docker-rootless",
        },
      ]
    }

    loki.source.file "docker_logs" {
      targets    = local.file_match.docker_logs.targets
      forward_to = [loki.process.docker_json.receiver]
    }

    loki.process "docker_json" {
      stage.json {
        expressions = {
          message = "log",
          stream  = "stream",
          time    = "time",
        }
      }

      stage.timestamp {
        source = "time"
        format = "RFC3339Nano"
      }

      stage.output {
        source = "message"
      }

      stage.labels {
        values = {
          stream = "",
        }
      }

      forward_to = [loki.write.local.receiver]
    }

    loki.write "local" {
      endpoint {
        url = "http://groupec-loki:3100/loki/api/v1/push"
      }
    }

