#cloud-config
# ============================================================================
# CR465 - GROUPEC : BASE COMMUNE + OBSERVABILITE INTEGREE
# V3 : correctif TLS Keycloak V2 + permissions write_files explicites (!!str).
# ============================================================================
#
# COUVERTURE FONCTIONNELLE DE CE FICHIER:
#   - Ubuntu 24.04, SSH par cle, UFW et Docker Engine Rootless
#   - Traefik HTTPS local, redirection HTTP, dashboard protegee
#   - Nginx WEBTEST temporaire via Traefik
#   - PostgreSQL 17, 5 bases/logins (dont Opencast optionnel) et secrets aleatoires
#   - Portainer CE sous Docker Rootless, HTTPS via Traefik et volume persistant
#   - Grafana 12.3.0, Loki 3.5.5, Alloy 1.10.2 : observabilite integree
#   - Quatre reseaux Docker dont donnees et observabilite --internal
#
# NON INSTALLE DANS CETTE BASE:
#   - Drupal Commerce et n8n (obligatoires); Moodle / Keycloak sont integres
#   - Opencast (optionnel), Redis et OpenAppSec (bonus)
#   - Leurs emplacements write_files sont reserves COMMENTES. Portainer/observabilite actifs.
# NE PAS REUTILISER UNE VM CONTENANT DEJA UN VOLUME POSTGRESQL.
# ============================================================================

# Installation non interactive sur une VM Ubuntu 24.04 fraiche.
package_update: true
package_upgrade: true
# L utilisateur admin "ubuntu" est celui fourni par Multipass.
users:
- default
# Aucun mot de passe SSH; Multipass gere la cle publique de connexion.
ssh_pwauth: false
disable_root: true
packages:
- ca-certificates
- curl
- git
- jq
- uidmap
- dbus-user-session
- slirp4netns
- fuse-overlayfs
- ufw
- openssl
- openssh-server
- apache2-utils

# ==========================================================================
# WRITE_FILES : tous les fichiers sont crees AVANT les commandes runcmd.
# ==========================================================================
- python3
write_files:
  # ------------------------------------------------------------------------
  # ETAPE 1 - preparation Docker Engine + SSH + pare-feu
  # ------------------------------------------------------------------------
- path: /usr/local/sbin/prepare-docker-rootless.sh
  owner: root:root
  permissions: !!str "0755"
  content: |
    #!/usr/bin/env bash
    # EXPLICATION : Mode Bash strict : -e stoppe sur erreur, -u refuse les variables absentes, pipefail detecte les echecs dans les pipelines.
    set -euo pipefail
    # EXPLICATION : Evite qu apt affiche une question interactive lors de l installation automatisee.
    export DEBIAN_FRONTEND=noninteractive

    # Installer le moteur Docker et le plugin Compose depuis le depot officiel.
    # EXPLICATION : Cree le repertoire des cles APT avec des permissions de lecture standard (0755).
    install -m 0755 -d /etc/apt/keyrings
    # EXPLICATION : Recupere la cle GPG du depot officiel Docker pour verifier les paquets.
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    # EXPLICATION : Donne aux processus APT le droit de lire cette cle.
    chmod a+r /etc/apt/keyrings/docker.asc
    # EXPLICATION : Ecrit le fichier de depot APT Docker. SOURCES termine le bloc multilignes Bash.
    cat > /etc/apt/sources.list.d/docker.sources <<SOURCES
    Types: deb
    URIs: https://download.docker.com/linux/ubuntu
    Suites: noble
    Components: stable
    Architectures: $(dpkg --print-architecture)
    Signed-By: /etc/apt/keyrings/docker.asc
    SOURCES
    # EXPLICATION : Recharge les listes des paquets maintenant que le depot Docker a ete ajoute.
    apt-get update
    # EXPLICATION : Installe le moteur Docker, son client CLI, containerd, Buildx, Compose et les outils Rootless. -y confirme automatiquement.
    apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin docker-ce-rootless-extras

    # Eviter tout demon Docker privilegie en parallele.
    # EXPLICATION : Desactive et arrete le daemon et le socket Docker privilegies ; le daemon utilisateur sera installe ensuite.
    systemctl disable --now docker.service docker.socket
    # EXPLICATION : Supprime un eventuel socket systeme residuel (-f ignore son absence), sans toucher au futur socket Rootless.
    rm -f /run/docker.sock

    # Garder SSH autorise sur la VM laboratoire, aucun port applicatif public.
    # EXPLICATION : Prevoit une exception SSH TCP/22 avant d activer le pare-feu pour eviter de bloquer cette administration.
    systemctl enable --now ssh
    ufw allow 22/tcp
    # Acces HTTPS Traefik pour le labo. Avec VirtualBox NAT, publication Windows
    # uniquement sur 127.0.0.1:4443 via la regle natpf1 cote hote.
    ufw allow 4443/tcp
    # EXPLICATION : Active UFW sans demander confirmation ; les ports applicatifs ne sont pas ouverts ici.
    ufw --force enable

  # ------------------------------------------------------------------------
  # ETAPE 2 - activation et validation du demon Docker ROOTLESS
  # ------------------------------------------------------------------------
- path: /usr/local/sbin/activate-docker-rootless.sh
  owner: root:root
  permissions: !!str "0755"
  content: |
    #!/usr/bin/env bash
    # EXPLICATION : Stoppe les erreurs plutot que de continuer avec une installation partiellement validee.
    set -euo pipefail

    # Reprend la procedure rootless deja validee dans le projet.
    # EXPLICATION : Compte Linux NON root qui possedera et executera le moteur Docker.
    DOCKER_USER=ubuntu
    # EXPLICATION : Calcule son UID numerique (habituellement 1000, sans supposer que cette valeur est fixe).
    USER_ID="$(id -u "$DOCKER_USER")"
    # EXPLICATION : Repertoire runtime systemd de cet utilisateur ; contient le socket du daemon Rootless.
    RUNTIME_DIR="/run/user/${USER_ID}"
    # EXPLICATION : Adresse D-Bus utilisee pour communiquer avec le gestionnaire systemd de l utilisateur.
    BUS_ADDRESS="unix:path=${RUNTIME_DIR}/bus"

    # Docker Rootless requiert au moins 65536 UID/GID subordonnes.
    # EXPLICATION : Verifie les plages d identifiants utilisateurs et groupes subordonnes requises par les user namespaces Rootless.
    for file in /etc/subuid /etc/subgid; do
      # EXPLICATION : awk lit les champs separes par deux-points et exige >=65536 UID/GID subordonnes pour ubuntu.
      if ! awk -F: '$1 == "ubuntu" && $3 >= 65536 {ok=1} END{exit !ok}' "$file"; then
        echo "ERREUR: plage UID/GID insuffisante dans $file" >&2
        exit 1
      fi
    done

    # EXPLICATION : Conserve le gestionnaire systemd de ubuntu actif meme lorsqu aucune session SSH n est ouverte.
    loginctl enable-linger "$DOCKER_USER"
    # EXPLICATION : Lance le gestionnaire systemd --user associe a cet UID.
    systemctl start "user@${USER_ID}.service"
    # EXPLICATION : Attend au plus 30 iterations la creation du bus D-Bus utilisateur, plutot que de supposer un demarrage instantane.
    for i in $(seq 1 30); do
      [ -S "${RUNTIME_DIR}/bus" ] && break
      sleep 1
    done
    # EXPLICATION : Verifie que le chemin est bien un socket (-S) ; arrete si le bus n est jamais apparu.
    [ -S "${RUNTIME_DIR}/bus" ] || { echo 'ERREUR: bus systemd absent' >&2; exit 1; }

    # EXPLICATION : Fonction reutilisable : execute une commande comme ubuntu, avec HOME, variables systemd et PATH corrects.
    user_cmd() {
      runuser -u "$DOCKER_USER" -- env \
        HOME="/home/${DOCKER_USER}" USER="$DOCKER_USER" LOGNAME="$DOCKER_USER" \
        XDG_RUNTIME_DIR="$RUNTIME_DIR" \
        DBUS_SESSION_BUS_ADDRESS="$BUS_ADDRESS" \
        PATH="/usr/local/bin:/usr/bin:/bin" "$@"
    }

    # EXPLICATION : Installe et configure le service Docker Rootless pour ubuntu, PAS pour root.
    user_cmd dockerd-rootless-setuptool.sh install
    # EXPLICATION : Active Docker au demarrage du gestionnaire utilisateur et le lance immediatement.
    user_cmd systemctl --user enable --now docker.service
    # EXPLICATION : Selectionne le contexte Docker CLI pointant vers le daemon Rootless.
    user_cmd docker context use rootless

    # EXPLICATION : Drapeau de verification ; reste "no" jusqu a ce que le daemon confirme le mode rootless.
    verified=no
    # EXPLICATION : Attend au plus 30 iterations la creation du bus D-Bus utilisateur, plutot que de supposer un demarrage instantane.
    for i in $(seq 1 30); do
      # EXPLICATION : Interroge les options de securite de Docker ; grep recherche "rootless". stderr est masque pendant l attente.
      if user_cmd docker info --format '{{json .SecurityOptions}}' 2>/dev/null | grep -q rootless; then
        verified=yes
        break
      fi
      sleep 2
    done
    # EXPLICATION : Refuse de poursuivre l installation si le daemon n a pas ete valide.
    [ "$verified" = yes ] || { echo 'ERREUR: Docker Rootless non operationnel' >&2; exit 1; }
    echo 'SUCCES: Docker Rootless installe et actif sous ubuntu'
    # EXPLICATION : Affiche les options finales comme preuve technique dans les journaux cloud-init.
    user_cmd docker info --format '{{json .SecurityOptions}}'

  # ------------------------------------------------------------------------
  # SSH : configuration de l acces administrateur sans mot de passe
  # ------------------------------------------------------------------------
- path: /etc/ssh/sshd_config.d/99-groupec.conf
  owner: root:root
  permissions: !!str "0644"
  content: |
    # SSH avec cles uniquement; aucun acces root par SSH.
    # Multipass installe normalement la cle de connexion dans ubuntu.
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitRootLogin no
    PubkeyAuthentication yes

  # ------------------------------------------------------------------------
  # TRAEFIK - Compose avec HTTPS, dashboard protege et file provider
  # ------------------------------------------------------------------------
- path: /opt/GroupeC/traefik/docker-compose.yml
  owner: root:root
  permissions: !!str "0644"
  content: |
    # TRAEFIK - fichier Compose reel (lance au premier boot)
    # HTTP 8081 et ping 8080 restent lies a localhost; HTTPS 4443 sur les interfaces de la VM.
    # Pas de socket Docker monte: file provider pour reduire les privileges.
    name: groupec-traefik
    services:
      traefik:
        image: traefik:v3.5
        restart: unless-stopped
        logging:
          driver: "json-file"
          options:
            max-size: "10m"
            max-file: "3"
        security_opt:
          - no-new-privileges:true
        read_only: true
        tmpfs:
          - /tmp
        command:
          - "--entrypoints.web.address=:80"
          # Redirection vers le port HTTPS externe de ce laboratoire: 4443.
          - "--entrypoints.web.http.redirections.entrypoint.to=:4443"
          - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
          - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
          - "--entrypoints.websecure.address=:443"
          # Port interne reserve aux appels OIDC depuis Moodle, jamais publie sur l hote.
          - "--entrypoints.sso-internal.address=:4443"
          - "--entrypoints.ping.address=:8080"
          - "--ping=true"
          - "--ping.entrypoint=ping"
          - "--providers.file.directory=/dynamic"
          - "--providers.file.watch=true"
          - "--api=true"
          - "--api.dashboard=true"
          - "--api.insecure=false"
          - "--log.level=INFO"
          - "--accesslog=true"
        ports:
          # Seul HTTPS 4443 peut etre accessible sur le reseau de la VM, sous controle UFW.
          # Ne pas ouvrir 4443 a tous; autoriser une IP cliente lors des tests.
          - "127.0.0.1:8080:8080"
          - "127.0.0.1:8081:80"
          - "4443:443"
        volumes:
          - /opt/GroupeC/traefik/dynamic:/dynamic:ro
          - /opt/GroupeC/traefik/certs:/certs:ro
          - /opt/GroupeC/traefik/auth:/auth:ro
        networks:
          exposition: {}
          applicatif:
            # IP interne stable: seule IP privee autorisee dans cURL Moodle.
            ipv4_address: 172.28.240.10
            aliases:
              # Resolution interne du nom public vers Traefik pour les appels OIDC.
              - keycloak.groupec.test
              - moodle.groupec.test
    networks:
      exposition:
        external: true
        name: GroupeC-exposition
      applicatif:
        external: true
        name: GroupeC-applicatif
  # ------------------------------------------------------------------------
  # TRAEFIK - certificat TLS dynamique
  # ------------------------------------------------------------------------
- path: /opt/GroupeC/traefik/dynamic/tls.yaml
  owner: root:root
  permissions: !!str "0644"
  content: |
    # Certificat local autosigne genere automatiquement par deploy.sh.
    # Il n est PAS signe par une CA publique: navigateur = avertissement normal.
    tls:
      certificates:
        - certFile: /certs/local.crt
          keyFile: /certs/local.key
      options:
        default:
          minVersion: VersionTLS12

  # ------------------------------------------------------------------------
  # TRAEFIK - routes de laboratoire + emplacements futurs services
  # ------------------------------------------------------------------------
- path: /opt/GroupeC/traefik/dynamic/routes.yaml
  owner: root:root
  permissions: !!str "0644"
  content: |
    # TRAEFIK - routage HTTPS local. Aucun socket Docker n est monte.
    # Portainer et Grafana actifs; routage HTTPS depuis Traefik.
    # Drupal et n8n restent a integrer ; Moodle et Keycloak sont ajoutes dans des routes separees.
    http:
      routers:
        demo:
          rule: "Host(`demo.localhost`)"
          entryPoints:
            - websecure
          service: demo-service
          tls: {}
        dashboard:
          rule: "Host(`dashboard.localhost`)"
          entryPoints:
            - websecure
          service: api@internal
          middlewares:
            - dashboard-auth
          tls: {}
        portainer:
          rule: "Host(`portainer.localhost`) || Host(`portainer.groupec.test`)"
          entryPoints:
            - websecure
          service: portainer-service
          tls: {}
        # La route Grafana utilise le service DNS "grafana" sur GroupeC-applicatif.
        grafana:
          rule: "Host(`grafana.groupec.test`)"
          entryPoints:
            - websecure
          service: grafana-service
          tls: {}
        # Moodle/Keycloak : routes ACTIVES dans dynamic/moodle-route.yaml et dynamic/keycloak-route.yaml.
        # TODO DRUPAL: ajouter router Host(`drupal.localhost`) et service drupal:80.
        # TODO N8N: ne PAS exposer son interface admin sans controle d acces.
        # TODO OPENCAST: si actif, route HTTPS vers le service video interne.
        # REDIS/LOKI: aucun routage public.
        # OPENAPPSEC: mode standalone local, integrer selon la doc WAF/Traefik.
      middlewares:
        dashboard-auth:
          basicAuth:
            usersFile: /auth/users.htpasswd
      services:
        demo-service:
          loadBalancer:
            servers:
              - url: "http://webtest:80"
        portainer-service:
          loadBalancer:
            servers:
              - url: "http://portainer:9000"
        grafana-service:
          loadBalancer:
            servers:
              - url: "http://grafana:3000"

  # ------------------------------------------------------------------------
  # NGINX provisoire - test du reverse proxy HTTPS (non publie)
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # ROUTES SEPAREES ET MODELE DE REALM - AJOUTS MOODLE / KEYCLOAK
  # ------------------------------------------------------------------------
- path: /opt/GroupeC/traefik/dynamic/moodle-route.yaml
  owner: root:root
  permissions: !!str "0644"
  content: |
    # Moodle 5.3 via Traefik : route et middleware du collegue.
    # Domaine canonique moodle.groupec.test ; alias .localhost pour les essais VM.
    http:
      routers:
        moodle:
          rule: (Host(`moodle.groupec.test`) || Host(`moodle.localhost`))
          entryPoints:
          - websecure
          service: moodle-service
          middlewares:
          - moodle-headers
          - moodle-ratelimit
          tls: {}
        moodle-login:
          rule: (Host(`moodle.groupec.test`) || Host(`moodle.localhost`)) && PathPrefix(`/login`)
          priority: 100
          entryPoints:
          - websecure
          service: moodle-service
          middlewares:
          - moodle-headers
          - moodle-login-ratelimit
          tls: {}
      middlewares:
        moodle-headers:
          headers:
            stsSeconds: 31536000
            contentTypeNosniff: true
            customFrameOptionsValue: SAMEORIGIN
            referrerPolicy: strict-origin-when-cross-origin
        moodle-ratelimit:
          rateLimit:
            average: 50
            burst: 100
        moodle-login-ratelimit:
          rateLimit:
            average: 5
            burst: 10
      services:
        moodle-service:
          loadBalancer:
            servers:
            - url: http://moodle:8080

- path: /opt/GroupeC/traefik/dynamic/keycloak-route.yaml
  owner: root:root
  permissions: !!str "0644"
  content: |
    # Keycloak OIDC : 443 (public via 4443 hote), et 4443 interne pour Moodle.
    # Aucun port HTTP direct vers l hote.
    http:
      routers:
        keycloak:
          rule: Host(`keycloak.groupec.test`) || Host(`keycloak.localhost`)
          entryPoints:
          - websecure
          - sso-internal
          service: keycloak-service
          tls: {}
      services:
        keycloak-service:
          loadBalancer:
            servers:
            - url: http://keycloak:8080

- path: /opt/GroupeC/keycloak/groupec-realm.template.json
  owner: root:root
  permissions: !!str "0644"
  content: |
    {
      "realm": "groupec",
      "enabled": true,
      "displayName": "Groupe C - Plateforme pédagogique",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "resetPasswordAllowed": true,
      "clients": [
        {
          "clientId": "moodle",
          "name": "Moodle LMS",
          "description": "SSO Moodle - Groupe C",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "rootUrl": "https://moodle.groupec.test:4443",
          "baseUrl": "https://moodle.groupec.test:4443",
          "redirectUris": [
            "https://moodle.groupec.test:4443/admin/oauth2callback.php"
          ],
          "webOrigins": [
            "https://moodle.groupec.test:4443"
          ],
          "defaultClientScopes": [
            "web-origins",
            "acr",
            "profile",
            "roles",
            "email"
          ],
          "optionalClientScopes": [
            "address",
            "phone",
            "offline_access"
          ]
        }
      ]
    }

- path: /opt/GroupeC/webtest/docker-compose.yml
  owner: root:root
  permissions: !!str "0644"
  content: |
    # Service TEMPORAIRE pour prouver le routage de Traefik.
    # Supprimable lorsque les vraies applications sont disponibles.
    # EXPLICATION : Projet de demonstration Nginx, distinct du projet Traefik.
    name: groupec-webtest
    # EXPLICATION : Contient le service HTTP temporaire utilise pour valider le reverse proxy.
    services:
      # EXPLICATION : Nom DNS Docker webtest, utilise dans l URL definie par Traefik.
      webtest:
        # EXPLICATION : Image Nginx legere basee sur Alpine Linux (version 1.28).
        image: nginx:1.28-alpine
        # EXPLICATION : Redemarre automatiquement Nginx avec Docker tant qu il n est pas arrete volontairement.
        restart: unless-stopped
        logging:
          driver: "json-file"
          options:
            max-size: "10m"
            max-file: "3"
        # EXPLICATION : Applique des protections supplementaires au processus du conteneur.
        security_opt:
          # EXPLICATION : Empeche le gain de nouveaux privileges pour les processus Nginx.
          - no-new-privileges:true
        # Aucun "ports": uniquement accessible via le reseau applicatif.
        # EXPLICATION : Le service Nginx n est attache qu au reseau applicatif, pas aux donnees.
        networks:
          # EXPLICATION : Traefik et Nginx partagent ce reseau pour pouvoir communiquer.
          - applicatif

    # EXPLICATION : Le service Nginx n est attache qu au reseau applicatif, pas aux donnees.
    networks:
      applicatif:
        # EXPLICATION : Compose reutilise un reseau cree ailleurs au lieu de creer son propre reseau prive.
        external: true
        # EXPLICATION : Nom exact du reseau cree par le script de deploiement.
        name: GroupeC-applicatif
  # ------------------------------------------------------------------------
  # POSTGRESQL 17 - volume, secrets, reseau donnees uniquement
  # ------------------------------------------------------------------------
- path: /opt/GroupeC/postgresql/docker-compose.yml
  owner: root:root
  permissions: !!str "0644"
  content: |
    # EXPLICATION : Projet Compose separe, dedie a la couche de donnees PostgreSQL.
    name: groupec-postgresql
    # EXPLICATION : Liste des conteneurs de ce fichier : ici un seul serveur PostgreSQL.
    services:
      # EXPLICATION : Nom du service : les applications sur le reseau donnees utiliseront "postgres" comme hote.
      postgres:
        # EXPLICATION : Image PostgreSQL version 17 ; les mises a jour mineures peuvent changer avec ce tag.
        image: postgres:17
        # EXPLICATION : Relance PostgreSQL au redemarrage, sauf si on l a arrete volontairement.
        restart: unless-stopped
        logging:
          driver: "json-file"
          options:
            max-size: "10m"
            max-file: "3"
        # EXPLICATION : Variables lues par le script de demarrage de l image officielle PostgreSQL.
        environment:
          # EXPLICATION : Cree le superutilisateur PostgreSQL initial nomme postgres.
          POSTGRES_USER: postgres
          # EXPLICATION : Cree/selectionne la base initiale postgres.
          POSTGRES_DB: postgres
          # EXPLICATION : Lit le mot de passe administrateur depuis un fichier secret, pas depuis une valeur dans le YAML.
          POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
          # EXPLICATION : Demande SCRAM-SHA-256 pour les connexions TCP initiales de PostgreSQL.
          POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
        # Aucun port publie : connexion seulement via le reseau Docker donnees.
        # EXPLICATION : Persiste les donnees et monte le script d initialisation dans le conteneur.
        volumes:
          # EXPLICATION : Volume Docker nomme : les donnees restent apres recreation du conteneur (sans "down -v").
          - postgres_data:/var/lib/postgresql/data
          # EXPLICATION : Script execute automatiquement par l image officielle si le volume de donnees est vide.
          - /opt/GroupeC/postgresql/initdb/01-init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
        # EXPLICATION : Liste des secrets accessibles a CE conteneur PostgreSQL.
        secrets:
          # EXPLICATION : Mot de passe administrateur, lu au demarrage par POSTGRES_PASSWORD_FILE.
          - postgres_admin_password
          # EXPLICATION : Mot de passe du role Moodle, utilise par le script initdb.
          - moodle_db_password
          # EXPLICATION : Mot de passe du role Keycloak, utilise par le script initdb.
          - keycloak_db_password
          # EXPLICATION : Mot de passe du role Drupal, utilise par le script initdb.
          - drupal_db_password
          # EXPLICATION : Mot de passe du role n8n, utilise par le script initdb.
          - n8n_db_password
          # EXPLICATION : Mot de passe de la base Opencast (service optionnel).
          - opencast_db_password
        # EXPLICATION : PostgreSQL rejoint UNIQUEMENT le reseau de donnees.
        networks:
          # EXPLICATION : Pas de liaison reseau directe avec Traefik ; seules les applications autorisees rejoindront donnees.
          - donnees
        # EXPLICATION : Verification recurrente pour savoir si PostgreSQL accepte des connexions.
        healthcheck:
          # EXPLICATION : pg_isready teste si PostgreSQL est pret ; ne verifie pas toutes les applications ni leurs schemas.
          test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
          # EXPLICATION : Lance le healthcheck toutes les 5 secondes.
          interval: 5s
          # EXPLICATION : Un essai expire apres 3 secondes.
          timeout: 3s
          # EXPLICATION : Apres 30 echecs consecutifs, Docker peut declarer le conteneur unhealthy.
          retries: 30
          # EXPLICATION : Accorde un delai initial de 20 secondes avant de compter les echecs.
          start_period: 20s

    # EXPLICATION : Persiste les donnees et monte le script d initialisation dans le conteneur.
    volumes:
      # EXPLICATION : Declare le volume nomme que Docker gere pour conserver les fichiers de la base.
      postgres_data:

    # EXPLICATION : Liste des secrets accessibles a CE conteneur PostgreSQL.
    secrets:
      # Les valeurs sont generees a la creation de la VM, jamais dans ce YAML.
      # EXPLICATION : Reference le fichier de secret administrateur genere sur la VM.
      postgres_admin_password:
        file: /opt/GroupeC/secrets/postgres_admin_password
      # EXPLICATION : Reference le fichier du secret Moodle.
      moodle_db_password:
        file: /opt/GroupeC/secrets/moodle_db_password
      # EXPLICATION : Reference le fichier du secret Keycloak.
      keycloak_db_password:
        file: /opt/GroupeC/secrets/keycloak_db_password
      # EXPLICATION : Reference le fichier du secret Drupal.
      drupal_db_password:
        file: /opt/GroupeC/secrets/drupal_db_password
      # EXPLICATION : Reference le fichier du secret n8n.
      n8n_db_password:
        file: /opt/GroupeC/secrets/n8n_db_password
      # Mot de passe SQL Opencast, genere meme si le service est desactive.
      opencast_db_password:
        file: /opt/GroupeC/secrets/opencast_db_password

    # EXPLICATION : PostgreSQL rejoint UNIQUEMENT le reseau de donnees.
    networks:
      donnees:
        # EXPLICATION : Compose ne cree pas ce reseau : il reutilise GroupeC-donnees deja cree par deploy.sh.
        external: true
        # EXPLICATION : Nom commun de la zone de donnees, avec option Docker --internal.
        name: GroupeC-donnees
  # ------------------------------------------------------------------------
  # POSTGRESQL - initialisation de 5 bases, 5 roles et isolation des connexions
  # ------------------------------------------------------------------------
- path: /opt/GroupeC/postgresql/initdb/01-init-databases.sh
  owner: root:root
  permissions: !!str "0755"
  content: |
    #!/usr/bin/env bash
    # EXPLICATION : Arrete le script d initialisation si une commande, variable ou pipeline echoue.
    set -euo pipefail

    # Lance par le point d'entree de postgres:17 UNIQUEMENT sur volume vide.
    # Secrets generes sur la VM et montes dans /run/secrets; pas dans GitHub.
    # Noms de bases/roles fixes et mots de passe aleatoires hexadecimaux.
    # EXPLICATION : Repete la preparation pour 5 applications (Opencast optionnel inclus).
    for app in moodle keycloak drupal n8n opencast; do
      # EXPLICATION : Lit le secret de l application dans le conteneur. La variable Bash ne sera pas imprimee.
      password="$(cat "/run/secrets/${app}_db_password")"
      # EXPLICATION : Controle que le secret est une chaine hexadecimale de 64 caracteres (32 octets aleatoires).
      [[ "$password" =~ ^[0-9a-f]{64}$ ]] || { echo "Mot de passe invalide pour $app" >&2; exit 1; }

      # \gexec execute les instructions SQL produites par SELECT sans
      # ajouter de bloc DO ni de transaction autour de CREATE DATABASE.
      # EXPLICATION : Ouvre psql; -X ignore les reglages utilisateur, -q est discret, ON_ERROR_STOP arrete sur SQL invalide. <<SQL commence le SQL.
      psql -X -q -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<SQL
    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', '${app}', '${password}')
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='${app}')
    \gexec
    SELECT format('CREATE DATABASE %I OWNER %I', '${app}', '${app}')
    WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname='${app}')
    \gexec
    SQL
      # Isolation: aucun role applicatif ne peut se connecter aux AUTRES BDs.
      # Par defaut, PostgreSQL accorde CONNECT au role PUBLIC ; on le retire.
      psql -X -q -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
        -c "REVOKE CONNECT ON DATABASE \"${app}\" FROM PUBLIC; GRANT CONNECT ON DATABASE \"${app}\" TO \"${app}\";"
      # Le schema public ne doit pas etre accessible librement aux autres roles.
      psql -X -q -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$app" \
        -c "REVOKE ALL ON SCHEMA public FROM PUBLIC; GRANT USAGE, CREATE ON SCHEMA public TO \"${app}\";"

      # EXPLICATION : Efface la variable temporaire de mot de passe apres creation du role.
      unset password
      # EXPLICATION : Affiche seulement le nom de l application dans les journaux, jamais son mot de passe.
      echo "Base et role prets: ${app}"
    done

  # ------------------------------------------------------------------------
  # MOODLE - INTEGRE : compose du collegue, HTTPS, PostgreSQL
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # MOODLE - provisionnement SSO natif, configure automatiquement au premier boot
  # ------------------------------------------------------------------------
- path: /opt/GroupeC/moodle/configure-sso.php
  owner: root:root
  permissions: !!str "0644"
  content: |
    <?php
    // CR465 - SSO Moodle -> Keycloak, lors du premier boot cloud-init.
    // Script idempotent : ne duplique ni fournisseur ni endpoints.
    define('CLI_SCRIPT', true);
    require '/var/www/html/config.php';
    \core\session\manager::set_user(get_admin());

    $secret = trim(stream_get_contents(STDIN));
    if (!preg_match('/^[a-f0-9]{48,128}$/', $secret)) {
        fwrite(STDERR, "ERREUR : secret client OIDC invalide.\n");
        exit(1);
    }
    $issuername = 'Keycloak Groupe C';
    $baseurl = 'https://keycloak.groupec.test:4443/realms/groupec';

    // Conserver les authentifications deja actives (dont email).
    $auth = array_filter(array_map('trim', explode(',', (string)($CFG->auth ?? ''))));
    if (!in_array('oauth2', $auth, true)) {
        $auth[] = 'oauth2';
        set_config('auth', implode(',', $auth));
    }

    $existing = $DB->get_record('oauth2_issuer', ['name' => $issuername]);
    if ($existing) {
        $issuer = new \core\oauth2\issuer((int)$existing->id);
        $issuer->set('clientid', 'moodle');
        $issuer->set('clientsecret', $secret);
        $issuer->set('baseurl', $baseurl);
        $issuer->set('enabled', true);
        $issuer->set('showonloginpage', \core\oauth2\issuer::LOGINONLY);
        $issuer->set('loginscopes', 'openid profile email');
        $issuer->update();
        echo "Fournisseur Keycloak deja present, parametres verifies.\n";
    } else {
        // La creation peut enregistrer l'issuer puis echouer pendant la
        // decouverte reseau. Reprendre cet issuer et creer les endpoints connus.
        try {
            $issuer = \core\oauth2\api::create_issuer((object)[
            'name' => $issuername,
            // Champ image NOT NULL dans Moodle: valeur vide autorisee.
            'image' => '',
            'clientid' => 'moodle',
            'clientsecret' => $secret,
            'baseurl' => $baseurl,
            'servicetype' => 'custom',
            'enabled' => true,
            'showonloginpage' => \core\oauth2\issuer::LOGINONLY,
            'loginscopes' => 'openid profile email',
            'requireconfirmation' => false,
            ]);
        } catch (\Throwable $err) {
            $partial = $DB->get_record('oauth2_issuer', ['name' => $issuername]);
            if (!$partial) {
                throw $err;
            }
            $issuer = new \core\oauth2\issuer((int)$partial->id);
            $issuer->set('clientid', 'moodle');
            $issuer->set('clientsecret', $secret);
            $issuer->set('baseurl', $baseurl);
            $issuer->set('enabled', true);
            $issuer->set('showonloginpage', \core\oauth2\issuer::LOGINONLY);
            $issuer->set('loginscopes', 'openid profile email');
            $issuer->update();
            echo "Issuer partiellement cree lors de la decouverte; endpoints configures explicitement.\n";
        }
        echo "Fournisseur Keycloak cree ou repare.\n";
    }

    $id = (int)$issuer->get('id');
    $endpointurls = [
        'authorization_endpoint' => $baseurl . '/protocol/openid-connect/auth',
        'token_endpoint' => $baseurl . '/protocol/openid-connect/token',
        'userinfo_endpoint' => $baseurl . '/protocol/openid-connect/userinfo',
    ];
    foreach ($endpointurls as $name => $url) {
        $row = $DB->get_record('oauth2_endpoint', ['issuerid' => $id, 'name' => $name]);
        if ($row) {
            if ($row->url !== $url) {
                $endpoint = new \core\oauth2\endpoint((int)$row->id);
                $endpoint->set('url', $url);
                $endpoint->update();
            }
        } else {
            \core\oauth2\api::create_endpoint((object)[
                'issuerid' => $id, 'name' => $name, 'url' => $url,
            ]);
        }
    }

    // Keycloak userinfo : given_name/family_name/email -> champs Moodle obligatoires.
    foreach (['given_name' => 'firstname', 'family_name' => 'lastname', 'email' => 'email'] as $external => $internal) {
        if (!$DB->record_exists('oauth2_user_field_mapping', ['issuerid' => $id, 'internalfield' => $internal])) {
            \core\oauth2\api::create_user_field_mapping((object)[
                'issuerid' => $id, 'externalfield' => $external, 'internalfield' => $internal,
            ]);
        }
    }

    if (!$issuer->is_available_for_login()) {
        fwrite(STDERR, "ERREUR : fournisseur non utilisable sur la page de connexion.\n");
        exit(1);
    }
    foreach (array_keys($endpointurls) as $name) {
        if (!$DB->record_exists('oauth2_endpoint', ['issuerid' => $id, 'name' => $name])) {
            fwrite(STDERR, "ERREUR : endpoint OIDC manquant: $name\n");
            exit(1);
        }
    }
    $mappings = $DB->count_records('oauth2_user_field_mapping', ['issuerid' => $id]);
    if ($mappings < 3) {
        fwrite(STDERR, "ERREUR : mappings SSO incomplets ($mappings/3).\n");
        exit(1);
    }
    echo "SUCCES : fournisseur Keycloak OAuth2 configure dans Moodle (issuer id=$id, endpoints et mappings presents).\n";

