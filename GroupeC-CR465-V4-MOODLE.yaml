          $module->grademethod = 1;
          $module->preferredbehaviour = 'deferredfeedback';

          add_moduleinfo($module, $course);
      }

      echo "Quiz Moodle configure.\n";

      // Questions et reponses du quiz.
      $questions = [
          [
              'question' => 'Quels sont les trois piliers de la cybersecurite ?',
              'answers' => [
                  'Confidentialite, integrite et disponibilite',
                  'Authentification, rapidite et stockage',
                  'Internet, reseau et serveur'
              ]
          ],
          [
              'question' => 'Quel est le but du phishing ?',
              'answers' => [
                  'Voler des informations sensibles',
                  'Ameliorer la securite',
                  'Mettre a jour un logiciel'
              ]
          ],
          [
              'question' => 'Que signifie MFA ?',
              'answers' => [
                  'Authentification multifacteur',
                  'Module de filtrage automatique',
                  'Methode de fichier avancee'
              ]
          ],
          [
              'question' => 'Quelle pratique ameliore la securite ?',
              'answers' => [
                  'Effectuer regulierement les mises a jour',
                  'Partager ses mots de passe',
                  'Desactiver les protections'
              ]
          ],
          [
              'question' => 'Quel est le but d un rancongiciel ?',
              'answers' => [
                  'Bloquer les donnees et exiger une rancon',
                  'Accelerer un ordinateur',
                  'Proteger les fichiers'
              ]
          ]
      ];      
      // Enregistrement des questions dans le quiz.
      require_once($CFG->dirroot . '/lib/questionlib.php');
      require_once($CFG->dirroot . '/mod/quiz/locallib.php');

      $quiz = $DB->get_record('quiz', [
          'course' => $course->id,
          'name' => $quizname
      ], '*', MUST_EXIST);

      $cm = get_coursemodule_from_instance(
          'quiz', $quiz->id, $course->id, false, MUST_EXIST
      );

      $quizcontext = context_module::instance($cm->id);
      $category = question_get_default_category($quizcontext->id, true);

      foreach ($questions as $index => $item) {
          $name = 'CYBER465-Q' . ($index + 1);

          $questionid = $DB->get_field_sql(
              "SELECT q.id
                 FROM {question} q
                 JOIN {question_versions} qv ON qv.questionid = q.id
                 JOIN {question_bank_entries} qbe
                   ON qbe.id = qv.questionbankentryid
                WHERE qbe.questioncategoryid = :category
                  AND q.name = :name
             ORDER BY qv.version DESC",
              ['category' => $category->id, 'name' => $name],
              IGNORE_MULTIPLE
          );

          if (!$questionid) {
              $question = new stdClass();
              $question->qtype = 'multichoice';

              $form = new stdClass();
              $form->category = (string)$category->id;
              $form->name = $name;
              $form->questiontext = [
                  'text' => $item['question'],
                  'format' => FORMAT_HTML
              ];
              $form->generalfeedback = [
                  'text' => '',
                  'format' => FORMAT_HTML
              ];
              $form->defaultmark = 2;
              $form->penalty = 0;
              $form->single = 1;
              $form->shuffleanswers = 1;
              $form->answernumbering = 'abc';
              $form->status = 'ready';

              foreach ($item['answers'] as $i => $answer) {
                  $form->answer[$i] = [
                      'text' => $answer,
                      'format' => FORMAT_HTML
                  ];
                  $form->fraction[$i] = ($i === 0) ? 1 : 0;
                  $form->feedback[$i] = [
                      'text' => '',
                      'format' => FORMAT_HTML
                  ];
              }

              foreach (['correctfeedback',
                        'partiallycorrectfeedback',
                        'incorrectfeedback'] as $field) {
                  $form->$field = [
                      'text' => '',
                      'format' => FORMAT_HTML
                  ];
              }

              $saved = question_bank::get_qtype('multichoice')
                  ->save_question($question, $form);

              $questionid = $saved->id;
          }

          quiz_add_quiz_question($questionid, $quiz, 0, 2);
      }

      echo "Questions du quiz configurees.\n";
      // Recalcul du total des points du quiz.
      \mod_quiz\quiz_settings::create($quiz->id)
          ->get_grade_calculator()
          ->recompute_quiz_sumgrades();

      echo "Total des points du quiz recalcule.\n";

- path: /opt/GroupeC/moodle/docker-compose.yml
  owner: root:root
  permissions: !!str "0644"
  content: |
    # Moodle - service LMS; acces HTTPS uniquement via Traefik.
    # Les variables sensibles proviennent du .env local genere par deploy.sh.
    # Image communautaire (pas d image Moodle officielle de production):
    # base Alpine legere, execution en utilisateur non-root, version figee.
    name: groupec-moodle
    services:
      moodle:
        image: erseco/alpine-moodle:v5.3.0
        restart: unless-stopped
        env_file:
          - /opt/GroupeC/moodle/.env
        environment:
          SITE_URL: "https://moodle.groupec.test:4443"
          DB_TYPE: pgsql
          DB_HOST: postgres
          DB_PORT: "5432"
          DB_NAME: moodle
          DB_USER: moodle
          REVERSEPROXY: "false"
          # TLS termine par Traefik: Moodle recoit du HTTP mais son wwwroot
          # est en https. sslproxy=true evite boucles de redirection et contenu mixte.
          SSLPROXY: "true"
        # --- Moindre privilege ---
        security_opt:
          - no-new-privileges:true
        # nginx/php-fpm ecoutent sur 8080 en non-root: aucune capability Linux requise.
        cap_drop:
          - ALL
        # --- Limites de ressources (anti-DoS, anti fork bomb) ---
        mem_limit: 1g
        cpus: "1.5"
        pids_limit: 256
        # --- Systeme de fichiers ---
        # read_only impossible: l image ecrit config.php au demarrage (ecart justifie).
        # /tmp en memoire, sans execution de binaires ni setuid.
        tmpfs:
          - /tmp:rw,noexec,nosuid,size=128m
        volumes:
          - moodledata:/var/www/moodledata
          - /opt/GroupeC/moodle/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
          - /opt/GroupeC/moodle/configure-sso.php:/opt/groupec-configure-sso.php:ro
          - /opt/GroupeC/moodle/configure-curl-oidc.php:/opt/groupec-configure-curl-oidc.php:ro
